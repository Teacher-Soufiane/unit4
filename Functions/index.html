  <script>
const quizConfig={unit:"4",title:"EXPRESSING CAUSE & EFFECT",lesson:"FUNCTIONS - QUIZ 1",questions:[
{type:"drag-classify",category:"Classify the Connectors",question:"CLASSIFY THE CONNECTORS INTO THE CORRECT CATEGORY.",columns:["Expressing Cause","Expressing Effect"],tiles:[["t1","because","Expressing Cause"],["t2","since","Expressing Cause"],["t3","because of","Expressing Cause"],["t4","due to","Expressing Cause"],["t5","so","Expressing Effect"],["t6","therefore","Expressing Effect"],["t7","as a result","Expressing Effect"],["t8","consequently","Expressing Effect"]].map(x=>({id:x[0],text:x[1],correctColumn:x[2]})),explanation:"'Because', 'since', 'because of', and 'due to' introduce a cause. 'So', 'therefore', 'as a result', and 'consequently' introduce an effect.",points:5},
{type:"single-choice",category:"Spot the Cause",question:"WHICH PART OF THE SENTENCE EXPRESSES THE CAUSE?",task:"Many students were absent because they were sick.",choices:["Many students","were absent","because they were sick","students were absent"],correctAnswer:"because they were sick",explanation:"The cause is introduced by 'because' — it explains why the students were absent.",points:1},
{type:"single-choice",category:"Spot the Effect",question:"WHICH PART OF THE SENTENCE EXPRESSES THE EFFECT?",task:"The roads were flooded because it rained heavily.",choices:["it rained heavily","because","The roads were flooded","heavily"],correctAnswer:"The roads were flooded",explanation:"The effect is the result — the roads being flooded.",points:1},
{type:"matching",category:"Cause → Effect Matching",question:"MATCH EACH CAUSE WITH ITS MOST LOGICAL EFFECT.",pairs:[["1","The students didn't study for the test.","They got low marks."],["2","The government invested more money in renewable energy.","The use of clean energy increased."]].map(x=>({id:x[0],sentence:x[1],correctFunction:x[2]})),functionOptions:["They got low marks.","The use of clean energy increased.","They cancelled the test."],explanation:"'They cancelled the test' is the distractor — it doesn't logically follow from either cause.",points:2},
{type:"single-choice",category:"Choose the Best Connector",question:"COMPLETE THE SENTENCE WITH THE MOST APPROPRIATE CONNECTOR.",task:"Salma stayed at home ______ she was feeling ill.",choices:["because","so","therefore","as a result"],correctAnswer:"because",explanation:"'Because' introduces the cause directly before a clause.",points:1},
{type:"single-choice",category:"Choose the Best Connector",question:"CHOOSE THE BEST CONNECTOR.",task:"The weather was extremely cold. ______, many people stayed indoors.",choices:["Because","Due to","As a result","Since"],correctAnswer:"As a result",explanation:"'As a result' introduces an effect in a new sentence.",points:1},
{type:"single-choice",category:"Choose the Best Connector",question:"CHOOSE THE CORRECT EXPRESSION.",task:"______ the heavy traffic, Youssef arrived late at school.",choices:["Because","Because of","So","Therefore"],correctAnswer:"Because of",explanation:"'Because of' is followed by a noun phrase.",points:1},
{type:"complete-exchange",category:"Complete the Exchange",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:[["A","Why didn't you come to the football match yesterday?"],["B","..."]],choices:["I couldn't come because I had to help my parents.","I couldn't come so I had to help my parents.","I couldn't come therefore I had to help my parents.","I couldn't come as a result I had to help my parents."],correctAnswer:"I couldn't come because I had to help my parents.",function:"Expressing Cause",explanation:"'Because' correctly introduces the reason B could not attend.",points:1},
{type:"complete-exchange",category:"Complete the Exchange",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:[["A","Why are so many people using public transport?"],["B","..."]],choices:["Because of the high price of fuel, many people prefer buses and trains.","Because the high price of fuel, many people prefer buses and trains.","So the high price of fuel, many people prefer buses and trains.","Therefore the high price of fuel, many people prefer buses and trains."],correctAnswer:"Because of the high price of fuel, many people prefer buses and trains.",function:"Expressing Cause",explanation:"'Because of' + noun phrase correctly introduces the cause.",points:1},
{type:"complete-exchange",category:"Complete the Exchange",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:[["A","Why was the school competition cancelled?"],["B","..."]],choices:["There was heavy rain. As a result, the organizers decided to cancel it.","There was heavy rain. Because, the organizers decided to cancel it.","There was heavy rain. Due to, the organizers decided to cancel it.","There was heavy rain. Since, the organizers decided to cancel it."],correctAnswer:"There was heavy rain. As a result, the organizers decided to cancel it.",function:"Expressing Effect",explanation:"'As a result' correctly introduces the consequence of the heavy rain.",points:1},
{type:"single-choice",category:"Situation → Best Expression",question:"WHAT IS THE BEST RESPONSE?",task:"Your friend asks why you are carrying an umbrella.",choices:["I'm carrying it because it may rain.","I'm carrying it therefore it may rain.","I'm carrying it as a result it may rain.","I'm carrying it because of it may rain."],correctAnswer:"I'm carrying it because it may rain.",explanation:"'Because' + clause correctly gives the reason.",points:1},
{type:"single-choice",category:"Situation → Best Expression",question:"WHICH SENTENCE IS BEST?",task:"Your teacher asks why many students arrived late. You want to explain that a traffic jam caused the delay.",choices:["Many students arrived late so the traffic jam.","Many students arrived late because of the traffic jam.","Many students arrived late therefore the traffic jam.","Many students arrived late as a result the traffic jam."],correctAnswer:"Many students arrived late because of the traffic jam.",explanation:"'Because of' + noun phrase correctly explains the cause.",points:1},
{type:"single-choice",category:"Challenge Scenario",question:"CHOOSE THE SENTENCE THAT EXPRESSES THE CAUSE AND EFFECT CORRECTLY.",task:"A factory released a large amount of smoke. Air pollution increased in the area.",choices:["Air pollution increased because the factory released a large amount of smoke.","Air pollution increased although the factory released a large amount of smoke.","Air pollution increased in order to release factory smoke.","Air pollution increased unless the factory released a large amount of smoke."],correctAnswer:"Air pollution increased because the factory released a large amount of smoke.",explanation:"'Because' correctly links the effect to its cause.",points:1},
{type:"single-choice",category:"Challenge Scenario",question:"CHOOSE THE SENTENCE WITH THE CORRECT CAUSE-AND-EFFECT RELATIONSHIP.",task:"Many young people do not have enough job opportunities in rural areas. Some of them move to cities.",choices:["Some young people move to cities because there are not enough job opportunities in rural areas.","Some young people move to cities although there are not enough job opportunities in rural areas.","Some young people move to cities in order to create a lack of jobs in rural areas.","Some young people move to cities unless there are enough job opportunities in rural areas."],correctAnswer:"Some young people move to cities because there are not enough job opportunities in rural areas.",explanation:"'Because' correctly links moving to cities to lack of job opportunities.",points:1},
{type:"single-choice",category:"Final Challenge",question:"WHICH SENTENCE BEST EXPRESSES THE COMPLETE CAUSE-AND-EFFECT RELATIONSHIP?",task:"A school started a recycling programme. Students began separating paper, plastic, and glass. The amount of waste sent to landfill decreased.",choices:["The amount of waste sent to landfill decreased because the school introduced a recycling programme.","The amount of waste sent to landfill decreased although students separated their waste.","The school introduced a recycling programme so that waste could increase.","Students separated their waste because the amount of landfill waste had already decreased."],correctAnswer:"The amount of waste sent to landfill decreased because the school introduced a recycling programme.",explanation:"This correctly links less landfill waste to the recycling programme.",points:1}
]};
let current=0,score=0,seconds=0,timerId=null,selectedTile=null;
const app=document.getElementById("app");
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function sound(kind){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=kind==="good"?660:kind==="bad"?190:380;g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.18)}catch(e){}}
const timer={start(){if(!timerId)timerId=setInterval(()=>{seconds++;updateStats()},1000)},pause(){clearInterval(timerId);timerId=null},reset(){this.pause();seconds=0},format(){return String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0")}};
function updateStats(){let answered=quizConfig.questions.filter(q=>q.locked),correct=answered.filter(q=>q.awarded>0).length;document.querySelectorAll(".stats").forEach(el=>el.innerHTML=`<span>✅ Correct: ${correct}</span><span>❌ Wrong: ${answered.length-correct}</span><span>Remaining: ${15-answered.length}</span><span>Score: ${score.toFixed(2)} /20</span><span>Timer ${timer.format()}</span>`)}
function feedback(q,good){return `<div class="feedback ${good?"":"bad"}"><strong>${good?["Excellent!","Great Job!","Perfect!","Keep Going!"][Math.floor(Math.random()*4)]:["Almost!","Review this rule.","Keep learning!","You'll get the next one!"][Math.floor(Math.random()*4)]}</strong><br>${q.explanation}</div>`}
function controls(){let q=quizConfig.questions[current];return `<div class="nav-row"><button class="nav-btn" onclick="go(-1)" ${current===0?"disabled":""}>◀ Previous</button><strong>${current+1} / 15</strong><button class="nav-btn" onclick="go(1)" ${!q.locked?"disabled":""}>Next ▶</button></div><div class="stats"></div>`}
function render(){if(current===0&&!timerId)timer.start();let q=quizConfig.questions[current],body=`<div class="instruction">${q.question}</div>`;if(q.type==="drag-classify")body+=renderDrag(q);if(q.type==="matching")body+=renderMatching(q);if(q.type==="single-choice")body+=renderChoice(q);if(q.type==="complete-exchange")body+=renderExchange(q);app.innerHTML=body+controls();updateStats()}
function renderChoice(q){q._displayOrder||=shuffle(q.choices);return `<p class="task">${q.task}</p>${q._displayOrder.map((x,i)=>`<button class="choice ${q.locked?(x===q.correctAnswer?"correct":x===q.answer?"wrong":""):""}" ${q.locked?"disabled":""} onclick="answerChoice(${i})"><b>${i+1}.</b> ${x}</button>`).join("")}${q.locked?feedback(q,q.answer===q.correctAnswer):""}`}
function answerChoice(i){let q=quizConfig.questions[current];if(q.locked)return;q.answer=q._displayOrder[i];q.awarded=q.answer===q.correctAnswer?q.points:0;score+=q.awarded;q.locked=true;sound(q.awarded?"good":"bad");render()}
function renderDrag(q){q._displayOrder||=shuffle(q.tiles);q.placements||={};let pool=q._displayOrder.filter(t=>!q.placements[t.id]);let zone=c=>q._displayOrder.filter(t=>q.placements[t.id]===c);let tile=t=>`<button draggable="true" class="tile ${selectedTile===t.id?"active":""} ${q.locked?(q.placements[t.id]===t.correctColumn?"result-good":"result-bad"):""}" ondragstart="dragTile(event,'${t.id}')" onclick="pickTile('${t.id}')">${t.text}${q.locked&&q.placements[t.id]!==t.correctColumn?` → ${t.correctColumn}`:""}</button>`;return `<div class="tile-pool" ondragover="event.preventDefault()" ondrop="dropTile(event,'pool')">${pool.map(tile).join("")||"<em>All tiles placed</em>"}</div><div class="drag-grid">${q.columns.map(c=>`<div class="drop-zone" tabindex="0" ondragover="event.preventDefault()" ondrop="dropTile(event,'${c}')"><h3>${c}</h3>${zone(c).map(tile).join("")}</div>`).join("")}</div>${!q.locked?`<button class="action-btn" style="margin-top:18px" onclick="checkDrag()" ${Object.keys(q.placements).length!==q.tiles.length?"disabled":""}>Check Answers</button>`:feedback(q,q.awarded===q.points)}`}
function dragTile(e,id){e.dataTransfer.setData("text/plain",id);sound("click")}
function pickTile(id){selectedTile=selectedTile===id?null:id;sound("click");render()}
function dropTile(e,column){let id=e.dataTransfer.getData("text/plain")||selectedTile;if(!id)return;let q=quizConfig.questions[current];if(q.locked)return;if(column==="pool")delete q.placements[id];else q.placements[id]=column;selectedTile=null;sound("click");render()}
function checkDrag(){let q=quizConfig.questions[current],per=q.points/q.tiles.length;q.awarded=q.tiles.reduce((sum,t)=>sum+(q.placements[t.id]===t.correctColumn?per:0),0);score+=q.awarded;q.locked=true;sound(q.awarded===q.points?"good":"bad");render()}
function renderMatching(q){q._displayOrder||=shuffle(q.functionOptions);q.selections||={};return `${q.pairs.map((p,i)=>`<div class="match-row ${q.locked?(q.selections[p.id]===p.correctFunction?"correct":"wrong"):""}"><div><b>${i+1}.</b> ${p.sentence}</div><div><select ${q.locked?"disabled":""} onchange="setMatch('${p.id}',this.value)"><option value="">Choose an effect…</option>${q._displayOrder.map(x=>`<option ${q.selections[p.id]===x?"selected":""}>${x}</option>`).join("")}</select>${q.locked&&q.selections[p.id]!==p.correctFunction?`<small><br>Correct: ${p.correctFunction}</small>`:""}</div></div>`).join("")}${!q.locked?`<button class="action-btn" onclick="checkMatches()" ${Object.keys(q.selections).length!==q.pairs.length?"disabled":""}>Check Matches</button>`:feedback(q,q.awarded===q.points)}`}
function setMatch(id,v){quizConfig.questions[current].selections[id]=v;render()}
function checkMatches(){let q=quizConfig.questions[current],per=q.points/q.pairs.length;q.awarded=q.pairs.reduce((s,p)=>s+(q.selections[p.id]===p.correctFunction?per:0),0);score+=q.awarded;q.locked=true;sound(q.awarded===q.points?"good":"bad");render()}
function renderExchange(q){q._displayOrder||=shuffle(q.choices);return `<div class="chat">${q.dialogue.map((d,i)=>`<div class="bubble ${d[0].toLowerCase()} ${i===1?"missing":""}">${q.locked?(i===1?(q.answer===q.correctAnswer?q.answer:q.correctAnswer):d[1]):d[1]}</div>`).join("")}</div>${q._displayOrder.map((x,i)=>`<button class="answer-card ${q.selected===x?"selected":""} ${q.locked?(x===q.correctAnswer?"correct":x===q.answer?"wrong":""):""}" ${q.locked?"disabled":""} onclick="selectExchange(${i})"><b>${i+1}.</b> ${x}</button>`).join("")}${!q.locked?`<button class="action-btn" onclick="checkExchange()" ${!q.selected?"disabled":""}>Check Answer</button>`:`<span class="function-tag">Function: ${q.function}</span>${feedback(q,q.awarded>0)}`}`}
function selectExchange(i){let q=quizConfig.questions[current];q.selected=q._displayOrder[i];sound("click");render()}
function checkExchange(){let q=quizConfig.questions[current];q.answer=q.selected;q.awarded=q.answer===q.correctAnswer?q.points:0;score+=q.awarded;q.locked=true;sound(q.awarded?"good":"bad");render()}
function go(dir){if(dir===1&&current===14){showResults();return}current=Math.max(0,Math.min(14,current+dir));render()}
function tier(){if(score>=17)return["Excellent!","You can use cause-and-effect expressions confidently."];if(score>=12.5)return["Very Good!","You understand the main cause-and-effect structures."];if(score>=8)return["Good Effort!","Review the difference between because / because of and so / therefore / as a result."];return["Keep Practising!","Focus first on identifying the cause and the effect, then practise choosing the appropriate connector."]}
function showResults(){timer.pause();let attempts=Number(localStorage.getItem("causeAttempts")||0)+1,best=Math.max(Number(localStorage.getItem("causeBest")||0),score);localStorage.setItem("causeAttempts",attempts);localStorage.setItem("causeBest",best);localStorage.setItem("causeLast",score);localStorage.setItem("causeTime",timer.format());let [name,msg]=tier(),correct=quizConfig.questions.filter(q=>q.awarded>0).length;app.innerHTML=`<section class="result"><h1>QUIZ RESULTS</h1><p>Unit ${quizConfig.unit} • ${quizConfig.title} • ${quizConfig.lesson}</p><div class="score-badge">${score.toFixed(2)}<small>/20</small></div><div id="remark" class="remark">Excellent!</div><p id="tier-message">${msg}</p><div class="summary"><h2>Performance Summary</h2><div class="summary-grid"><span>Final Score: <b>${score.toFixed(2)} /20</b></span><span>Correct Answers: <b>${correct}</b></span><span>Wrong Answers: <b>${15-correct}</b></span><span>Accuracy: <b>${((correct/15)*100).toFixed(0)}%</b></span><span>Time Taken: <b>${timer.format()}</b></span><span>Attempts: <b>${attempts}</b></span><span>Best Score: <b>${best.toFixed(2)} /20</b></span></div></div><div class="breakdown"><h2>Question Breakdown</h2><ol>${quizConfig.questions.map(q=>`<li><span>${q.category}</span><b>${q.awarded.toFixed(2)}/${q.points}</b></li>`).join("")}</ol></div><div class="result-actions"><button class="action-btn" onclick="review()">Review My Answers</button><button class="action-btn secondary" onclick="window.print()">Print Results</button><button class="action-btn secondary" onclick="saveResults()">Save Results</button><button class="action-btn" onclick="restart()">Restart Quiz</button></div></section>`;let labels=["Excellent!","Very Good!","Good Effort!","Keep Practising!"],i=0,spin=setInterval(()=>{document.getElementById("remark").textContent=labels[i++%4]},110);setTimeout(()=>{clearInterval(spin);document.getElementById("remark").textContent=name;document.getElementById("remark").classList.add("pop")},1200);if(score>=17)confetti();sound("good")}
function review(){app.innerHTML=`<h1 style="text-align:center">Review My Answers</h1>${quizConfig.questions.map((q,i)=>`<article class="review-card"><h3>${i+1}. ${q.category} — ${q.awarded.toFixed(2)}/${q.points}</h3><p><b>Instruction:</b> ${q.question}</p><p><b>${q.type==="drag-classify"?"Result":q.type==="matching"?"Matches":q.type==="complete-exchange"?"Student response":"Student Answer"}:</b> ${reviewText(q)}</p><p><b>Explanation:</b> ${q.explanation}</p></article>`).join("")}<div class="result-actions"><button class="action-btn" onclick="showResults()">Back to Results</button><button class="action-btn secondary" onclick="window.print()">Print Results</button></div>`}
function reviewText(q){if(q.type==="drag-classify")return q.tiles.map(t=>`${t.text}: Student's Column — ${q.placements[t.id]}; Correct Column — ${t.correctColumn}`).join("<br>");if(q.type==="matching")return q.pairs.map(p=>`${p.sentence}<br>Student: ${q.selections[p.id]||"No answer"}<br>Correct: ${p.correctFunction}`).join("<hr>");if(q.type==="complete-exchange")return `Student: ${q.answer||"No answer"}<br>Correct: ${q.correctAnswer}<br><span class="function-tag">Function: ${q.function}</span>`;return `Student: ${q.answer||"No answer"}<br>Correct: ${q.correctAnswer}`}
function saveResults(){let report=`Expressing Cause & Effect Quiz\nScore: ${score.toFixed(2)}/20\nTime Taken: ${timer.format()}\n\n${quizConfig.questions.map((q,i)=>`${i+1}. ${q.category}: ${q.awarded.toFixed(2)}/${q.points}`).join("\n")}`,a=document.createElement("a");a.href=URL.createObjectURL(new Blob([report],{type:"text/plain"}));a.download="cause-effect-quiz-results.txt";a.click();URL.revokeObjectURL(a.href)}
function restart(){quizConfig.questions.forEach(q=>{delete q._displayOrder;delete q.placements;delete q.selections;delete q.answer;delete q.selected;delete q.awarded;delete q.locked});current=0;score=0;selectedTile=null;timer.reset();render()}
function confetti(){["#2563eb","#15803d","#f59e0b","#dc2626","#9333ea"].forEach((c,k)=>{for(let i=0;i<20;i++){let d=document.createElement("i");d.className="confetti";d.style.left=Math.random()*100+"%";d.style.background=c;d.style.animationDelay=(Math.random()*1.2)+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}})}
document.addEventListener("keydown",e=>{let q=quizConfig.questions[current];if(!q||q.locked)return;if(q.type==="single-choice"&&/^[1-4]$/.test(e.key))answerChoice(+e.key-1);if(q.type==="complete-exchange"){if(/^[1-4]$/.test(e.key))selectExchange(+e.key-1);if(e.key==="Enter"&&q.selected)checkExchange()}});
render();
</script>
 
</body></html>
