    .confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:10;animation:fall 3.5s linear forwards}@keyframes fall{to{transform:translate(var(--x),1100px) rotate(800deg);opacity:0}}@media print{.quiz-shell{background:#fff;padding:0}.quiz-card{box-shadow:none}.top-header,.progress-track,.main-layout,.actions,.review{display:none!important}.results{display:block!important}.result-head p{display:block}}@media(min-width:600px){.header-teacher-img,.header-logo-img{height:80px}}@media(min-width:1024px){.header-teacher-img,.header-logo-img{height:96px}}@media(max-width:700px){.quiz-shell{padding:0}.quiz-card{border-radius:0;min-height:calc(100 * min(var(--vh,1vh),1vh)}.top-header{padding:9px 10px;gap:7px}.brand p{line-height:1.25}.meta-strip{padding:9px 10px;gap:4px}.main-layout{grid-template-columns:1fr;padding:14px}.side-panel{order:2}.choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{padding:11px 9px;font-size:.84rem}.results,.review{padding:18px}.summary-grid{grid-template-columns:1fr 1fr}}

  <script>
    /* Quiz configuration and source content */
    const quizConfig = {
      unit:"UNIT 4", title:"SUSTAINABLE DEVELOPMENT", lesson:"VOCABULARY - QUIZ 2", teacherName:"Teacher Soufiane",
      teacherImage:"https://i.imgur.com/vvyZAnr.png", logo:"https://imgur.com/XPOYllA",
      randomizeQuestions:false, randomizeChoices:true, timerEnabled:true, timerMode:"countup", countdownSeconds:600, showConfetti:true, enableSounds:true,
      questions:[
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","Medical services provided to maintain or improve people's physical and mental wellbeing.",["health care","water pollution","social justice","climate change"],"health care","Health care refers to medical services aimed at maintaining or improving people's wellbeing."],
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","The contamination of rivers, lakes, or oceans with harmful substances.",["water pollution","health care","social justice","climate change"],"water pollution","Water pollution is the contamination of water sources with harmful substances."],
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","Fair and equal treatment of all members of society regarding rights, opportunities, and resources.",["social justice","health care","water pollution","climate change"],"social justice","Social justice refers to fairness and equality within society regarding rights and opportunities."],
        ["single-choice","Choose the word that matches the definition","CHOOSE THE WORD THAT MATCHES THE DEFINITION.","Long-term shifts in temperatures and weather patterns, largely caused by human activity.",["climate change","health care","water pollution","social justice"],"climate change","Climate change refers to long-term shifts in temperatures and weather patterns, largely driven by human activity."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","After ______, BAC students will join universities for their higher education. (graduate)",["graduation","graduate","graduated","graduating"],"graduation","We need a noun after 'after', so the verb 'graduate' becomes 'graduation'."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","Some scientists ran away because of civil wars, starvation and political ______. (instable)",["instability","instable","unstable","instably"],"instability","We need a noun after 'political', so 'instable' becomes 'instability'."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","The late ______ crisis in Europe made a lot of immigrants return to their homeland. (economy)",["economic","economy","economical","economically"],"economic","We need an adjective before 'crisis', so 'economy' becomes 'economic'."],
        ["single-choice","Put the word in brackets in its correct form","PUT THE WORD IN BRACKETS IN ITS CORRECT FORM.","Many organizations ______ to the promotion of citizenship values. (contribution)",["contribute","contribution","contributive","contributing"],"contribute","We need a verb after 'organizations', so 'contribution' becomes 'contribute'."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Burning ______ fuels like coal and oil is a major cause of climate change.",["fossil","climate","healthcare","risk"],"fossil","'Fossil' fits because 'fossil fuels' like coal and oil are a major cause of climate change."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Oxfam works worldwide to fight poverty, while the WHO helps poor people access affordable ______.",["healthcare","fossil","climate","risk"],"healthcare","'Healthcare' fits because the WHO focuses on helping people access affordable medical services."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Deforestation and pollution pose a serious ______ to future generations.",["risk","fossil","healthcare","climate"],"risk","'Risk' fits because it describes a potential danger to future generations."],
        ["single-choice","Fill in the gap with the appropriate word from the list","FILL IN THE GAP WITH THE APPROPRIATE WORD FROM THE LIST.","Scientists warn that rising temperatures are a direct result of ______ change caused by human activity.",["climate","fossil","healthcare","risk"],"climate","'Climate' fits because the sentence discusses rising temperatures, which relates to climate change."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","Protecting property ______ encourages people to invest and build their own businesses.",["rights","pay","preservation","infrastructure"],"rights","'Property rights' is the correct natural collocation meaning legal ownership protections."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","Achieving equal ______ for women remains a major goal of many governments.",["pay","rights","preservation","infrastructure"],"pay","'Equal pay' is the correct natural collocation meaning receiving the same salary regardless of gender."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","Forest ______ helps protect endangered species and reduce carbon emissions.",["preservation","rights","pay","infrastructure"],"preservation","'Forest preservation' is the correct natural collocation meaning protecting forests from destruction."],
        ["single-choice","Choose the word that completes the collocation","CHOOSE THE WORD THAT COMPLETES THE COLLOCATION.","Improving transport ______ makes it easier to connect rural and urban areas.",["infrastructure","rights","pay","preservation"],"infrastructure","'Transport infrastructure' is the correct natural collocation meaning the systems and structures that support transportation."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","RESPONSIBLE",["accountable","reliable","dependable","irresponsible"],["accountable","reliable","dependable"],"irresponsible","'Accountable', 'reliable', and 'dependable' all describe being trustworthy and dutiful, like 'responsible'. 'Irresponsible' means the opposite — careless or unreliable."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","DESTRUCTION",["devastation","ruin","demolition","creation"],["devastation","ruin","demolition"],"creation","'Devastation', 'ruin', and 'demolition' all describe the act of destroying something, like 'destruction'. 'Creation' means the opposite — bringing something into existence."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","STARVATION",["famine","hunger","malnutrition","abundance"],["famine","hunger","malnutrition"],"abundance","'Famine', 'hunger', and 'malnutrition' all describe a severe lack of food, like 'starvation'. 'Abundance' means the opposite — a plentiful supply."],
        ["three-synonyms","Three Synonyms Challenge","SELECT THE THREE WORDS THAT ARE SYNONYMS OF THE TARGET WORD.","HOMELESS",["displaced","destitute","unsheltered","housed"],["displaced","destitute","unsheltered"],"housed","'Displaced', 'destitute', and 'unsheltered' all describe having no permanent place to live, like 'homeless'. 'Housed' means the opposite — having a place to live."]
      ]
    };

    const categoryNames=["Definitions","Word Forms","Word Bank","Collocations","Synonyms Challenge"];
    const correctMessages=["Excellent!","Great Job!","Perfect!","Keep Going!"];
    const wrongMessages=["Almost!","Review this rule.","Keep learning!","You'll get the next one!"];
    const $=id=>document.getElementById(id);
    const shuffle=a=>[...a].sort(()=>Math.random()-.5);
    const makeQuestions=()=>quizConfig.questions.map((q,i)=>q[0]==="single-choice"?{id:i,type:q[0],category:q[1],question:q[2],task:q[3],choices:quizConfig.randomizeChoices?shuffle(q[4]):q[4],correctAnswer:q[5],explanation:q[6],points:1}:{id:i,type:q[0],category:q[1],question:q[2],targetWord:q[3],options:quizConfig.randomizeChoices?shuffle(q[4]):q[4],correctSynonyms:q[5],antonym:q[6],explanation:q[7],points:1});
    let questions=[],current=0,answers={},synonymSelections=[],evaluationDelay=null,completed=false;

    /* Independent timer module */
    const timer=(()=>{let seconds=0,interval=null,running=false;
      const format=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
      const paint=()=>{$("timerDisplay").textContent=format(seconds)};
      const tick=()=>{if(quizConfig.timerMode==="countdown"){seconds--;if(seconds<=0){seconds=0;pause();autoFinish()}}else seconds++;paint()};
      const start=()=>{if(!quizConfig.timerEnabled||running)return;running=true;interval=setInterval(tick,1000)};
      const pause=()=>{running=false;clearInterval(interval)};
      const reset=()=>{pause();seconds=quizConfig.timerMode==="countdown"?quizConfig.countdownSeconds:0;paint()};
      const value=()=>seconds;return{start,pause,reset,format,value};
    })();

    function sound(kind){
      if(!quizConfig.enableSounds)return;
      try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);const map={click:[420,.05],good:[660,.14],bad:[180,.16],finish:[780,.24]};o.frequency.value=map[kind][0];g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+map[kind][1]);o.start();o.stop(ctx.currentTime+map[kind][1])}catch(e){}
    }
    function stats(){const a=Object.values(answers),correct=a.filter(x=>x.correct).length;return{correct,wrong:a.length-correct,remaining:20-a.length,score:correct}}
    function updateChrome(){
      const s=stats();$("correctCount").textContent=s.correct;$("wrongCount").textContent=s.wrong;$("remainingCount").textContent=s.remaining;$("scoreDisplay").textContent=`${s.score.toFixed(2)} /20`;
      $("counter").textContent=`${current+1} / 20`;$("progressFill").style.width=`${(Object.keys(answers).length/20)*100}%`;
      $("previousButton").disabled=current===0;$("nextButton").disabled=!answers[questions[current].id];
      $("nextButton").textContent=current===19&&answers[questions[current].id]?"Finish Quiz":"Next ▶";renderNavigator();
    }
    function renderNavigator(){
    }
    function feedback(correct,explanation){
      const el=$("feedbackArea");el.className=`feedback show ${correct?"good":"bad"}`;el.innerHTML=`<strong>${(correct?correctMessages:wrongMessages)[Math.floor(Math.random()*4)]}</strong><span>${explanation}</span>`;
    }
    function selectSingle(choice){
      const q=questions[current];if(answers[q.id])return;const correct=choice===q.correctAnswer;answers[q.id]={value:choice,correct};sound(correct?"good":"bad");renderQuestion();feedback(correct,q.explanation);updateChrome();
    }
    function renderSingle(q){
      $("taskArea").textContent=q.task;$("choicesArea").innerHTML="";
      q.choices.forEach((choice,i)=>{const b=document.createElement("button");b.type="button";b.className="choice";b.innerHTML=`<span class="option-key">${i+1}</span>${choice}`;
        if(answers[q.id]){b.disabled=true;if(choice===q.correctAnswer)b.classList.add("correct");if(choice===answers[q.id].value&&!answers[q.id].correct)b.classList.add("wrong")}else b.onclick=()=>selectSingle(choice);$("choicesArea").appendChild(b)});
      if(answers[q.id])feedback(answers[q.id].correct,q.explanation);
    }
    /* Synonym selection: evaluate only after three choices persist for half a second. */
    function toggleSynonym(option){
      const q=questions[current];if(answers[q.id])return;
      const index=synonymSelections.indexOf(option);if(index>-1)synonymSelections.splice(index,1);else if(synonymSelections.length<3)synonymSelections.push(option);
      sound("click");clearTimeout(evaluationDelay);renderSynonyms(q);
      if(synonymSelections.length===3)evaluationDelay=setTimeout(()=>{if(synonymSelections.length===3)evaluateSynonyms(q)},500);
    }
    function evaluateSynonyms(q){
      if(answers[q.id])return;const chosen=[...synonymSelections],correct=q.correctSynonyms.every(x=>chosen.includes(x));answers[q.id]={value:chosen,correct};sound(correct?"good":"bad");renderQuestion();feedback(correct,q.explanation);updateChrome();
    }
    function renderSynonyms(q){
      $("taskArea").innerHTML=`<span class="target-word">${q.targetWord}</span>`;$("choicesArea").innerHTML="";
      const answer=answers[q.id];
      q.options.forEach((option,i)=>{const b=document.createElement("button");b.type="button";b.className="choice";b.innerHTML=`<span class="option-key">${i+1}</span>${option}`;
        if(answer){b.disabled=true;const isSyn=q.correctSynonyms.includes(option),isSelected=answer.value.includes(option);if(isSyn)b.classList.add("correct");else if(isSelected)b.classList.add("wrong");else b.classList.add("muted");
          if(option===q.antonym)b.innerHTML+=`<span class="tag">${isSelected?"antonym, not a synonym":"antonym"}</span>`;
        }else{if(synonymSelections.includes(option))b.classList.add("selected");b.onclick=()=>toggleSynonym(option)}$("choicesArea").appendChild(b)});
      if(answer)feedback(answer.correct,q.explanation);
    }
    function renderQuestion(){
      clearTimeout(evaluationDelay);synonymSelections=[];$("feedbackArea").className="feedback";const q=questions[current];$("questionInstruction").textContent=q.question;
      if(q.type==="single-choice")renderSingle(q);else renderSynonyms(q);updateChrome();
    }
    function next(){if(!answers[questions[current].id])return;if(current===19){finishQuiz();return}current++;renderQuestion()}
    function previous(){if(current>0){current--;renderQuestion()}}
    function autoFinish(){if(!completed){const q=questions[current];if(!answers[q.id])answers[q.id]={value:q.type==="single-choice"?"Unanswered":[],correct:false};finishQuiz()}}
    function remarkFor(score){return score<10?"Fail":score<12?"Pass":score<14?"Fairly Good":score<16?"Good":score<18?"Very Good":"Excellent!"}
    function finishQuiz(){
      completed=true;timer.pause();$("quizView").style.display="none";$("resultsView").classList.add("active");const s=stats(),time=timer.format(timer.value());
      const attempts=Number(localStorage.getItem("sdAttempts")||0)+1,best=Math.max(Number(localStorage.getItem("sdBest")||0),s.score);
      localStorage.setItem("sdAttempts",attempts);localStorage.setItem("sdBest",best);localStorage.setItem("sdLast",s.score);localStorage.setItem("sdTime",time);
      $("resultMeta").textContent=`${quizConfig.unit} • ${quizConfig.title} • ${quizConfig.lesson}`;$("finalScore").textContent=s.score.toFixed(2);$("finalCorrect").textContent=s.correct;$("finalWrong").textContent=s.wrong;$("finalAccuracy").textContent=`${((s.correct/20)*100).toFixed(2)}%`;$("finalTime").textContent=time;$("attemptsValue").textContent=attempts;$("bestScoreValue").textContent=`${best.toFixed(2)} /20`;
      renderBreakdown();animateRemark(remarkFor(s.score));sound("finish");if(s.score>=16&&quizConfig.showConfetti)confetti();
    }
    function renderBreakdown(){
      $("breakdownList").innerHTML="";categoryNames.forEach((name,g)=>{const group=questions.slice(g*4,g*4+4),score=group.filter(q=>answers[q.id]?.correct).length;const line=document.createElement("div");line.className="break-line";line.innerHTML=`<span>${name}</span><strong>${score}/4</strong>`;$("breakdownList").appendChild(line)});
    }
    function animateRemark(finalRemark){
      const el=$("remark"),all=["Fail","Pass","Fairly Good","Good","Very Good","Excellent!"];let n=0,delay=70;
      (function spin(){el.textContent=all[n++%all.length];if(n<26){delay+=11;setTimeout(spin,delay)}else el.textContent=finalRemark})();
    }
    function confetti(){const colors=["#f4b622","#159447","#d9364a","#1676c6","#ffffff"];for(let i=0;i<70;i++){const c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=colors[i%colors.length];c.style.setProperty("--x",(Math.random()-.5)*400+"px");c.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}}
    function review(){
      $("resultsView").classList.remove("active");$("reviewView").classList.add("active");const holder=$("reviewContent");holder.innerHTML="";
      categoryNames.forEach((name,g)=>{const sec=document.createElement("section");sec.className="review-group";sec.innerHTML=`<h3>${name}</h3>`;
        questions.slice(g*4,g*4+4).forEach((q,i)=>{const a=answers[q.id],card=document.createElement("article");card.className="review-item";
          if(q.type==="single-choice")card.innerHTML=`<strong>Question ${g*4+i+1}</strong><p>${q.task}</p><p>Student Answer: <span class="${a.correct?"answer-good":"answer-bad"}">${a.value}</span></p><p>Correct Answer: <span class="answer-good">${q.correctAnswer}</span></p><p><b>Explanation:</b> ${q.explanation}</p>`;
          else card.innerHTML=`<strong>Question ${g*4+i+1} — Target Word: ${q.targetWord}</strong><p>Student's 3 selections: <span class="${a.correct?"answer-good":"answer-bad"}">${a.value.join(", ")||"Unanswered"}</span></p><p>Correct 3 synonyms: <span class="answer-good">${q.correctSynonyms.join(", ")}</span></p><p>Antonym distractor: <span class="answer-bad">${q.antonym}</span></p><p><b>Explanation:</b> ${q.explanation}</p>`;
          sec.appendChild(card)});holder.appendChild(sec)});
    }
    function restart(){questions=makeQuestions();if(quizConfig.randomizeQuestions){for(let g=0;g<5;g++){const group=shuffle(questions.slice(g*4,g*4+4));questions.splice(g*4,4,...group)}}current=0;answers={};completed=false;$("resultsView").classList.remove("active");$("reviewView").classList.remove("active");$("quizView").style.display="grid";timer.reset();timer.start();renderQuestion()}
    function saveResults(){
      const s=stats(),text=`SUSTAINABLE DEVELOPMENT VOCABULARY QUIZ 2\n${quizConfig.unit} | ${quizConfig.lesson}\n\nFinal Score: ${s.score.toFixed(2)} /20\nCorrect Answers: ${s.correct}\nWrong Answers: ${s.wrong}\nTime Taken: ${timer.format(timer.value())}\n\n${categoryNames.map((n,g)=>`${n}: ${questions.slice(g*4,g*4+4).filter(q=>answers[q.id]?.correct).length}/4`).join("\n")}`;
      const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));link.download="sustainable-development-quiz-results.txt";link.click();URL.revokeObjectURL(link.href);
    }
    document.addEventListener("keydown",e=>{if(completed)return;const q=questions[current];if(["1","2","3","4"].includes(e.key)){e.preventDefault();const option=(q.type==="single-choice"?q.choices:q.options)[Number(e.key)-1];if(q.type==="single-choice")selectSingle(option);else toggleSynonym(option)}if(e.key==="ArrowLeft")previous();if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){if(answers[q.id])next()}});
    $("previousButton").onclick=previous;$("nextButton").onclick=next;$("reviewButton").onclick=review;$("backResultsButton").onclick=()=>{$("reviewView").classList.remove("active");$("resultsView").classList.add("active")};$("restartButton").onclick=restart;$("printButton").onclick=()=>window.print();$("saveButton").onclick=saveResults;
    restart();
  </script>
 
</body></html>
