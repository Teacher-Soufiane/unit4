if(!ok){var m={};try{Object.defineProperty(window,"localStorage",{configurable:true,value:{
getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null},
setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}}}})}catch(e2){}}})();</script></head>
 <body>
  <div class="quiz-container">
   <div class="quiz-card canva-card">
    <div class="quiz-header canva-header"><img class="header-teacher-img" src="teacher.png" alt="Teacher Soufiane">
     <div class="header-title">
      <div class="title-line1">English2BAC Quizzes</div>

  <canvas id="cf"></canvas>
  <script>
/* ===== CONFIG ===== */
const quizConfig={unit:"3",title:"FUTURE FORMS — WILL vs BE GOING TO",lesson:"GRAMMAR QUIZ 1",randomizeQuestions:false,randomizeChoices:true,timerEnabled:true,timerMode:"countup",countdownSeconds:600,showConfetti:true,enableSounds:true};
/* ===== LEVELS (progression order; sizes = question counts) ===== */
const LV=[
{n:"Form Basics",i:"CHOOSE THE CORRECT FORM."},
{n:"Will: Decisions, Promises & Predictions",i:"CHOOSE THE BEST FUTURE FORM."},
{n:"Be Going To: Plans & Evidence",i:"CHOOSE THE BEST FUTURE FORM."},
{n:"Will vs Be Going To Mixed",i:"CHOOSE THE BEST FUTURE FORM."},
{n:"Error Correction & Transformation",i:"CHOOSE THE CORRECT VERSION."},
{n:"Real-Life Situations",i:"COMPLETE THE SITUATION."}];
/* Each item: [level, task, [CORRECT first, wrong, wrong, wrong], explanation, hint] */
const RAW=[
[1,"I ______ my grandparents tomorrow.",["will visit","will visited","will visiting","will to visit"],"After 'will' we use the base form of the verb: 'will visit'.","Think about the verb form that follows a modal verb."],
[1,"I ______ you later because I am very busy.",["won't help","won't helped","don't will help","won't helping"],"The negative of 'will' is 'won't' + base verb: 'won't help'.","Think about how the negative of 'will' is built."],
[1,"______ you call me later?",["Will","Do","Are","Did"],"A future question with the base verb 'call' starts with 'Will' + subject + base verb.","Look at the base verb 'call' and the word 'later'."],
[1,"Talking about travel plans for next month.",["We will travel next month.","We will traveled next month.","We will traveling next month.","We will to travel next month."],"'Will' is followed directly by the base verb: no 'to', no -ed, no -ing.","Think about what can come directly after 'will'."],
[2,"The phone is ringing. You decide to act immediately:<br>“I ______ it.”",["will answer","am going to answer","will answered","am answer"],"A decision made at the moment of speaking takes 'will' + base verb.","Think about whether the decision was made before or at this moment."],
[2,"Choose the best sentence for a promise:<br>“Don’t worry. I ______ your secret.”",["will keep","am going to keeping","will kept","am keep"],"Promises use 'will' + base verb: 'will keep'.","Think about the tense used for promises and the form after it."],
[2,"“I think our team ______ the match.”",["will win","is going to winning","will won","is win"],"An opinion-based prediction ('I think') uses 'will' + base verb.","Think about what 'I think' signals, and the verb form after it."],
[3,"Sara has already decided to study tonight. Which sentence best expresses her plan?",["She is going to revise tonight.","She will revised tonight.","She is going revise tonight.","She going to revise tonight."],"An already-decided plan uses 'be going to' with the full structure: is going to + base verb.","Look for the option with a complete 'be' + 'going to' structure."],
[3,"The students have already made a plan for their presentation. They ______ it carefully tonight.",["are going to prepare","will prepared","are going preparing","going to prepare"],"A plan made earlier takes 'be going to' + base verb: 'are going to prepare'.","Think about what 'already made a plan' tells you."],
[3,"Look at those dark clouds! It ______ soon.",["is going to rain","will raining","is going rain","will rained"],"Present evidence (dark clouds) points to a prediction with 'be going to': 'is going to rain'.","Think about what you can see right now and what it suggests."],
[3,"Meryem has already saved enough money and chosen a laptop. She ______ it next week.",["is going to buy","will bought","is going buying","going to buy"],"An existing plan takes 'be going to' + base verb: 'is going to buy'.","Think about the steps she has already taken."],
[4,"Your friend is carrying several heavy boxes. You offer to help immediately:<br>“I ______ these boxes for you.”",["will carry","am going to carry","will carried","am carry"],"An offer made on the spot takes 'will' + base verb: 'will carry'.","Think about whether this offer was planned in advance."],
[4,"“I think technology ______ even more important in education.”",["will become","is going becoming","will became","is become"],"A prediction based on opinion takes 'will' + base verb: 'will become'.","Think about the opening words 'I think' and the verb form that follows."],
[4,"The school has already planned an environmental campaign. The students ______ it next month.",["are going to organize","will organized","are going organizing","going to organize"],"A planned action takes 'be going to' + base verb: 'are going to organize'.","Think about what 'has already planned' signals."],
[4,"Look at the sky and the very dark clouds. It ______ tonight.",["is going to snow","will snowing","is going snow","will snowed"],"Visible evidence leads to a prediction with 'be going to': 'is going to snow'.","Think about what you can observe right now."],
[5,"Find the correct version:<br>“She will goes to university next year.”",["She will go to university next year.","She will went to university next year.","She will going to university next year.","She will to go to university next year."],"After 'will' we always use the base form: 'will go', not 'will goes'.","Think about the verb form required after 'will'."],
[5,"Choose the best transformation:<br>“I intend to apply for the scholarship next year.”",["I am going to apply for the scholarship next year.","I will applied for the scholarship next year.","I am going apply for the scholarship next year.","I going to apply for the scholarship next year."],"An intention is a plan, so it becomes 'be going to' + base verb: 'am going to apply'.","Think about which structure expresses an intention or plan, and what it needs to be complete."],
[6,"Complete the dialogue:<br>A: The phone is ringing.<br>B: “Don’t worry. I ______ it.”",["will pick","am going picking","will picked","am pick"],"A decision made at the moment of speaking takes 'will' + base verb: 'will pick'.","Think about whether B planned this in advance."],
[6,"They have already booked a hotel in Agadir for the summer. They ______ there for a week.",["are going to stay","will stayed","are going staying","going to stay"],"An existing plan (hotel already booked) takes 'be going to' + base verb: 'are going to stay'.","Think about what 'already booked' tells you."],
[6,"Look at that cyclist! He is losing his balance. He ______.",["is going to fall","will fell","is going fall","will falling"],"Present evidence (losing his balance) points to a prediction with 'be going to': 'is going to fall'.","Think about what you can see happening right now."]
];
const POS=["Excellent!","Great Job!","Perfect!","Keep Going!"],NEG=["Almost!","Review this rule.","Keep learning!","You'll get the next one!"];
const REM=[
{n:"Keep Practising",min:0,d:"Review the difference: 'will' for decisions, promises and opinions; 'be going to' for plans and evidence."},
{n:"Good Progress",min:11,d:"You understand the basics, but you need more practice choosing between 'will' and 'be going to'."},
{n:"Very Good",min:15,d:"You handle most future forms well. Review plans versus spontaneous decisions."},
{n:"Excellent",min:18,d:"You have a very strong command of 'will' and 'be going to' and when to use each one."}];
/* ===== QUESTION OBJECTS ===== */
let Q=RAW.map(r=>({level:r[0],task:r[1],ch:r[2],ex:r[3],hint:r[4]}));
if(quizConfig.randomizeQuestions)Q.sort(()=>Math.random()-.5);
const N=Q.length,$=id=>document.getElementById(id),KEY="futureForms_q1";
/* ===== TIMER MODULE (independent of rendering) ===== */
const Timer={id:null,s:0,onTick:null,
fmt(t){return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")},
start(){this.pause();this.id=setInterval(()=>{this.s+=quizConfig.timerMode==="countdown"?-1:1;this.onTick&&this.onTick(this.s)},1000)},
pause(){clearInterval(this.id);this.id=null},
reset(){this.pause();this.s=quizConfig.timerMode==="countdown"?quizConfig.countdownSeconds:0},
elapsed(){return quizConfig.timerMode==="countdown"?quizConfig.countdownSeconds-this.s:this.s}};
Timer.onTick=s=>{const e=$("tm");if(e)e.textContent=Timer.fmt(s);if(quizConfig.timerMode==="countdown"&&s<=0)finish()};
/* ===== STATE ===== */
let cur=0,ST=[],fin=false,review=false,saved={};
/* Shuffle ONCE per question; order is stored and never recomputed on re-render */
function qs(i){if(!ST[i]){let displayOrder=[0,1,2,3];if(quizConfig.randomizeChoices)for(let k=displayOrder.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[displayOrder[k],displayOrder[j]]=[displayOrder[j],displayOrder[k]]}ST[i]={displayOrder,picked:null,hint:false,fb:""}}return ST[i]}
function stats(){let c=0,w=0;ST.forEach(s=>{if(s&&s.picked!==null){s.picked===0?c++:w++}});return{c,w,r:N-c-w}}
/* ===== SOUNDS (WebAudio only) ===== */
let AC;function tone(seq){if(!quizConfig.enableSounds)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
/* ===== QUESTION SCREEN (single reusable renderer for all levels) ===== */
function showQuiz(){
const q=Q[cur],s=qs(cur),done=s.picked!==null,L=LV[q.level-1],st=stats();
let h=`<div class="ibox">${L.i}</div><div class="task">${q.task}</div><div class="choices">`;
s.displayOrder.forEach((oi,p)=>{let c="tile";if(done){if(oi===0)c+=" ok";else if(oi===s.picked)c+=" bad"}
h+=`<button class="${c}" ${done?"disabled":""} onclick="pick(${p})"><b>${"ABCD"[p]}</b><span>${q.ch[oi]}</span></button>`});
h+="</div>";
if(done)h+=`<div class="fb ${s.picked===0?"g":"r"}"><b>${s.fb}</b><p>${q.ex}</p></div>`;
else{h+=`<button class="hintb" onclick="hint()">💡 Hint</button>`;if(s.hint)h+=`<div class="hint">${q.hint}</div>`}
h+=`<div class="nav"><button class="btn" onclick="go(-1)" ${cur===0?"disabled":""}>◀ Previous</button><span>${cur+1} / ${N}</span><button class="btn" onclick="go(1)" ${done?"":"disabled"}>${cur===N-1?"Finish ✔":"Next ▶"}</button></div>
<div class="stats"><span>✅ Correct: ${st.c}</span><span>❌ Wrong: ${st.w}</span><span>Remaining: ${st.r}</span><span>Score: ${st.c.toFixed(2)} /20</span><span>⏱ <span id="tm">${Timer.fmt(Timer.s)}</span></span></div>`;
$("main").innerHTML=h}
function pick(p){const s=qs(cur);if(s.picked!==null)return;s.picked=s.displayOrder[p];
const ok=s.picked===0,a=ok?POS:NEG;s.fb=a[Math.floor(Math.random()*a.length)];
tone(ok?[[660,.12],[880,.2]]:[[300,.2],[220,.3]]);showQuiz();
if(cur===N-1)setTimeout(()=>{if(!fin)finish()},2500)}
function hint(){qs(cur).hint=true;showQuiz()}
function go(d){if(d>0&&qs(cur).picked===null)return;if(cur+d<0)return;if(cur+d>=N){finish();return}cur+=d;showQuiz()}
/* ===== RESULT PAGE ===== */
function levelRows(){return LV.map((l,i)=>{let t=0,c=0;Q.forEach((q,k)=>{if(q.level===i+1){t++;if(ST[k]&&ST[k].picked===0)c++}});return{n:`Level ${i+1} — ${l.n}`,c,t}})}
function finish(){if(fin)return;fin=true;Timer.pause();const st=stats(),sc=st.c,time=Timer.elapsed();
try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){saved={}}
saved={best:Math.max(saved.best||0,sc),attempts:(saved.attempts||0)+1,last:sc,time:time};
try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}
const R=[...REM].reverse().find(r=>sc>=r.min),acc=Math.round(sc/N*100);
let h=`<div class="center"><h2>QUIZ · Unit ${quizConfig.unit} · ${quizConfig.title} · ${quizConfig.lesson}</h2>
<div class="badge">${sc.toFixed(2)}<small>/20</small></div><div class="remark" id="rm">…</div><p id="rd"></p></div>
<table><tr><td>Final Score</td><td>${sc.toFixed(2)} /20</td></tr><tr><td>Correct Answers</td><td>${st.c}</td></tr><tr><td>Wrong Answers</td><td>${N-st.c}</td></tr><tr><td>Accuracy</td><td>${acc}%</td></tr><tr><td>Time Taken</td><td>${Timer.fmt(time)}</td></tr><tr><td>Number of Attempts</td><td>${saved.attempts}</td></tr><tr><td>Best Score</td><td>${saved.best.toFixed(2)} /20</td></tr>`;
levelRows().forEach(r=>h+=`<tr><td>${r.n}</td><td>${r.c}/${r.t}</td></tr>`);
h+=`</table><div class="btns"><button class="btn" onclick="toggleReview()">Review My Answers</button><button class="btn" onclick="restart()">Restart Quiz</button><button class="btn" onclick="window.print()">Print Results</button><button class="btn" onclick="saveRes()">Save Results</button></div><div id="rv"></div>`;
$("main").innerHTML=h;tone([[523,.15],[659,.15],[784,.15],[1047,.4]]);
let i=0,d=60,t=0;(function step(){if(t<3000){$("rm").textContent=REM[i++%4].n;t+=d;d*=1.12;setTimeout(step,d)}else{$("rm").textContent=R.n;$("rd").textContent=R.d}})();
if(quizConfig.showConfetti&&sc>=18)confetti()}
function toggleReview(){review=!review;let h="";if(review)LV.forEach((l,li)=>{h+=`<h3>Level ${li+1} — ${l.n}</h3>`;Q.forEach((q,k)=>{if(q.level!==li+1)return;const s=ST[k],ok=s.picked===0;h+=`<div class="rv ${ok?"g":"r"}"><b>Q${k+1}.</b> ${q.task}<br>Your answer: ${q.ch[s.picked]}<br>Correct answer: ${q.ch[0]}<br><i>${q.ex}</i></div>`})});$("rv").innerHTML=h}
function saveRes(){const st=stats();let t=`${quizConfig.title} — ${quizConfig.lesson} (Unit ${quizConfig.unit})\nScore: ${st.c.toFixed(2)} /20\nTime: ${Timer.fmt(Timer.elapsed())}\n\n`;levelRows().forEach(r=>t+=`${r.n}: ${r.c}/${r.t}\n`);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="quiz-results.txt";a.click()}
function restart(){ST=[];cur=0;fin=false;review=false;Timer.reset();Timer.start();showQuiz()}
/* ===== CONFETTI ===== */
function confetti(){const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,s:5+Math.random()*6,c:`hsl(${Math.random()*360},85%,55%)`}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<260)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
/* ===== KEYBOARD: 1-4 select, arrows / Enter / Space navigate ===== */
document.addEventListener("keydown",e=>{if(fin)return;
if("1234".includes(e.key)&&e.key.length===1){pick(+e.key-1);return}
if(e.target.tagName==="BUTTON"&&(e.key==="Enter"||e.key===" "))return;
if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){e.preventDefault();go(1)}
else if(e.key==="ArrowLeft")go(-1)});
/* ===== START ===== */
Timer.reset();showQuiz();if(quizConfig.timerEnabled)Timer.start();
</script>
