  <script>
  'use strict';
  // Configuration and question content are logic data, not editor presentation.
  const quizConfig={
    unit:"4",title:"EXPRESSING CAUSE AND EFFECT",lesson:"LISTENING - QUIZ 1",
    totalPoints:48,randomizeQuestions:false,randomizeChoices:true,
    audioFileUrl:"https://raw.githubusercontent.com/Teacher-Soufiane/unit4-listening/main/Unit4_Expressing_Cause_and_Effect_Quiz1_Final.mp3",
    audioTranscript:[
      ["Adam","Hey Malak, have you noticed how much plastic rubbish there is in our schoolyard lately?"],
      ["Malak","Yes, especially after the break. Students leave bottles and food wrappers everywhere because there aren't enough people putting rubbish in the bins."],
      ["Adam","I think that's part of the problem. Some students also throw rubbish on the ground even when a bin is nearby."],
      ["Malak","Exactly. As a result, the schoolyard looks dirty, and nobody really wants to sit there during the break."],
      ["Adam","It's not just about appearance, though. Plastic waste can also harm animals if they swallow it."],
      ["Malak","That's true. I read that some birds and stray animals mistake small pieces of plastic for food, so they can become seriously ill."],
      ["Adam","And when it rains heavily, plastic bags can block drainage systems."],
      ["Malak","Really? So that can cause flooding in the streets?"],
      ["Adam","Yes, especially in areas where rubbish collects near drains. Consequently, water can't flow away properly."],
      ["Malak","Now I understand why the streets near our school sometimes become flooded after heavy rain."],
      ["Adam","Exactly. Due to careless waste disposal, a small problem can become much more serious."],
      ["Malak","But why do people use so many plastic bottles and bags in the first place?"],
      ["Adam","They're cheap and convenient, so people often choose them instead of reusable alternatives."],
      ["Malak","I see. And because many of these products are used only once, they create a lot of waste."],
      ["Adam","That's right. Some plastic takes a very long time to break down, therefore it can remain in the environment for years."],
      ["Malak","That's worrying. What can we do to reduce the amount of plastic rubbish at school?"],
      ["Adam","We could encourage students to bring reusable water bottles instead of buying new plastic ones every day."],
      ["Malak","Good idea. If more students do that, we'll produce less plastic waste."],
      ["Adam","We could also put clearly labelled recycling bins around the school."],
      ["Malak","Yes, because students are more likely to recycle when they know exactly where to put their rubbish."],
      ["Adam","We should also organise a clean-up campaign to make students more aware of the consequences of littering."],
      ["Malak","I agree. As a result, students might become more responsible for keeping their school clean."],
      ["Adam","We could prepare posters explaining how plastic pollution affects animals and the environment, too."],
      ["Malak","That's a great idea. People sometimes change their behaviour when they understand the consequences of their actions."],
      ["Adam","Exactly. We shouldn't just complain about the problem; we should do something about it."],
      ["Malak","So, let's talk to our English teacher and suggest a school campaign."],
      ["Adam","Perfect. I'll prepare a few ideas for the posters, and you can suggest activities for the campaign."],
      ["Malak","Deal! Hopefully, our efforts will make a difference because a cleaner school benefits everyone."]
    ]
  };
  const single=(label,question,task,choices,correct,explanation)=>({type:"single-choice",taskLabel:label,question,task,choices,correctAnswer:correct,explanation,points:1});
  const match=(label,question,task,rows,chips,explanation)=>({type:"matching",taskLabel:label,question,task,rows:rows.map((text,i)=>({id:"r"+(i+1),text})),chips:chips.map((text,i)=>({id:"c"+(i+1),text,matchesRowId:"r"+(i+1)})),explanation,points:rows.length});
  const questions=[
    single("Task 1 — Complete the Sentence","COMPLETE THE SENTENCE.","The schoolyard is dirty ______ students leave bottles everywhere.",["because","as a result","therefore","consequently"],"because","'Because' introduces the cause (students leave bottles everywhere) of the result in the first clause."),
    single("Task 1 — Complete the Sentence","COMPLETE THE SENTENCE.","The streets flooded ______ the heavy rain.",["so","because of","as a result","therefore"],"because of","'Because of' is followed by a noun phrase (the heavy rain) and introduces a cause."),
    single("Task 1 — Complete the Sentence","COMPLETE THE SENTENCE.","Plastic takes years to break down. ______, it stays in the environment.",["Because","Due to","Therefore","Because of"],"Therefore","'Therefore' introduces a result and starts a new sentence after a comma."),
    single("Task 1 — Complete the Sentence","COMPLETE THE SENTENCE.","He forgot his reusable bottle, ______ he bought a new plastic one.",["because","due to","because of","so"],"so","'So' links a cause (he forgot his bottle) to its result (he bought a new one)."),
    match("Task 2 — Match the Word with its Meaning","MATCH THE WORD WITH ITS MEANING.","Drag each word to the meaning it matches.",["Things that people throw away","A pipe or channel that carries water away","Too much water covering land that is usually dry","Able to be used many times","Easy to use and saving time"],["rubbish","drain","flooding","reusable","convenient"],"These five words appear in the conversation: rubbish, drain, flooding, reusable and convenient."),
    {type:"multi-select-exact",taskLabel:"Task 3 — Predict the Listening",question:"PREDICT THE LISTENING.",task:"You are going to hear two students talking about a problem at their school. Which topics are you most likely to hear? Select THREE.",options:["Plastic rubbish in the schoolyard","A basketball tournament","The effects of plastic on animals","A new cafeteria menu","Flooding in the streets","A school trip to Marrakesh"],correctOptions:["Plastic rubbish in the schoolyard","The effects of plastic on animals","Flooding in the streets"],explanation:"The students discuss plastic rubbish in the schoolyard, its effects on animals, and flooding in the streets. A basketball tournament, a new cafeteria menu and a school trip are unrelated.",points:3},
    single("Task 4 — Choose the Best Summary","CHOOSE THE BEST SUMMARY.","What is the conversation mainly about?",["Two students argue about who should clean the schoolyard every day.","Two students discuss the causes and effects of plastic pollution at school.","Two students plan a weekend trip to a beach near their city.","Two students compare the prices of reusable bottles in shops."],"Two students discuss the causes and effects of plastic pollution at school.","Adam and Malak talk about why plastic rubbish is a problem at their school, what it causes, and how to reduce it."),
    single("Task 5 — Identify the Final Decision","IDENTIFY THE FINAL DECISION.","What do Adam and Malak decide to do at the end of the conversation?",["Write a letter to the mayor about blocked drains","Buy new rubbish bins for the neighbouring streets","Talk to their English teacher about a school campaign","Stop using plastic bottles for one whole month"],"Talk to their English teacher about a school campaign","Malak says: 'let's talk to our English teacher and suggest a school campaign.'"),
    match("Task 6 — Match the Cause with its Effect","MATCH THE CAUSE WITH ITS EFFECT.","Drag each effect to the cause it belongs to.",["Birds and stray animals swallow small pieces of plastic.","Plastic bags block the drainage systems.","Rubbish is left on the ground in the schoolyard.","Plastic takes a very long time to break down."],["They can become seriously ill.","Water can't flow away and the streets flood.","The schoolyard looks dirty.","It stays in the environment for years."],"Each cause mentioned in the conversation leads to a specific effect: animals become ill, streets flood, the schoolyard looks dirty, and plastic remains for years."),
    single("Task 7 — Understand the Reason","UNDERSTAND THE REASON.","Why do people use so many plastic bottles and bags?",["They are healthier than any reusable alternative.","They are given free in most local shops.","They are required by the school regulations.","They are cheap and convenient to use."],"They are cheap and convenient to use.","Adam says: 'They're cheap and convenient, so people often choose them instead of reusable alternatives.'"),
    single("Task 8 — Understand the Cause","UNDERSTAND THE CAUSE.","Why do many plastic products create a lot of waste?",["Because they are used only once","Because they are made in large factories","Because they are sold in very big sizes","Because people buy them mostly in summer"],"Because they are used only once","Malak says: 'because many of these products are used only once, they create a lot of waste.'"),
    single("Task 9 — Listen for a Detail","LISTEN FOR A DETAIL.","Which animals does Malak say can be harmed by plastic?",["Fish and sea turtles","Cows and sheep on farms","Birds and stray animals","Pets kept inside houses"],"Birds and stray animals","Malak says some birds and stray animals mistake small pieces of plastic for food."),
    single("Task 10 — Understand the Solution","UNDERSTAND THE SOLUTION.","What does Adam suggest to reduce plastic bottles at school?",["Selling cheaper bottles in the cafeteria","Bringing reusable water bottles to school","Banning all food inside the classrooms","Collecting old bottles from nearby streets"],"Bringing reusable water bottles to school","Adam suggests encouraging students to bring reusable water bottles instead of buying new plastic ones every day."),
    single("Task 11 — True or False","CHOOSE TRUE OR FALSE.","Some students throw rubbish on the ground even when a bin is nearby.",["True","False"],"True","Adam says some students throw rubbish on the ground even when a bin is nearby."),
    single("Task 11 — True or False","CHOOSE TRUE OR FALSE.","Animals can become ill because they mistake plastic for food.",["True","False"],"True","Malak says animals can become seriously ill because they mistake small pieces of plastic for food."),
    single("Task 11 — True or False","CHOOSE TRUE OR FALSE.","Adam says plastic breaks down very quickly in the environment.",["True","False"],"False","Adam says some plastic takes a very long time to break down and can remain in the environment for years."),
    single("Task 11 — True or False","CHOOSE TRUE OR FALSE.","Adam and Malak decide only to complain about the problem.",["True","False"],"False","Adam says they shouldn't just complain; they should do something, so they plan a school campaign."),
    single("Task 12 — Identify the Expression","IDENTIFY THE EXPRESSION.","\"Students leave bottles and food wrappers everywhere because there aren't enough people putting rubbish in the bins.\" Which expression of cause or effect is used?",["as a result","because","consequently","therefore"],"because","The sentence uses 'because' to introduce the cause."),
    single("Task 12 — Identify the Expression","IDENTIFY THE EXPRESSION.","\"As a result, the schoolyard looks dirty, and nobody really wants to sit there during the break.\" Which expression of cause or effect is used?",["because","due to","as a result","so"],"as a result","The sentence begins with 'As a result' to introduce the effect."),
    single("Task 12 — Identify the Expression","IDENTIFY THE EXPRESSION.","\"Consequently, water can't flow away properly.\" Which expression of cause or effect is used?",["because","therefore","due to","consequently"],"consequently","The sentence begins with 'Consequently' to introduce the effect."),
    single("Task 12 — Identify the Expression","IDENTIFY THE EXPRESSION.","\"Due to careless waste disposal, a small problem can become much more serious.\" Which expression of cause or effect is used?",["due to","as a result","consequently","therefore"],"due to","The sentence uses 'Due to' followed by a noun phrase to introduce the cause."),
    single("Task 13 — Identify the Effect","IDENTIFY THE EFFECT.","\"Plastic bags can block drainage systems. Consequently, water can't flow away properly.\" What is the effect?",["Plastic bags block the drains.","Water can't flow away properly.","It rains heavily in the area.","People throw rubbish near drains."],"Water can't flow away properly.","'Consequently' introduces the effect: water can't flow away properly."),
    single("Task 14 — Identify the Cause","IDENTIFY THE CAUSE.","\"Because many of these products are used only once, they create a lot of waste.\" Which part gives the cause?",["They create a lot of waste.","Plastic is very easy to recycle.","Many products are used only once.","Plastic is cheap and convenient."],"Many products are used only once.","The clause after 'Because' gives the cause; 'they create a lot of waste' is the effect."),
    single("Task 15 — Choose the Correct Expression","CHOOSE THE CORRECT EXPRESSION.","The bins were full. ______, rubbish was left on the ground.",["Because","Due to","As a result","Because of"],"As a result","'As a result' introduces the effect in a new sentence."),
    single("Task 15 — Choose the Correct Expression","CHOOSE THE CORRECT EXPRESSION.","The match was cancelled ______ the heavy rain.",["because","because of","therefore","as a result"],"because of","'Because of' is followed by a noun phrase (the heavy rain)."),
    single("Task 15 — Choose the Correct Expression","CHOOSE THE CORRECT EXPRESSION.","Many students bring reusable bottles ______ they want to produce less waste.",["because","because of","due to","consequently"],"because","'Because' is followed by a full clause (they want to produce less waste)."),
    single("Task 15 — Choose the Correct Expression","CHOOSE THE CORRECT EXPRESSION.","There was a lot of litter, ______ the students organised a clean-up campaign.",["due to","because","because of","so"],"so","'So' introduces the result after a comma."),
    single("Task 16 — Choose the Correct Sentence","CHOOSE THE CORRECT SENTENCE.","Which sentence is grammatically correct?",["Because the heavy rain, the streets were flooded.","Due to it rained heavily, the streets were flooded.","Due to the heavy rain, the streets were flooded.","As a result the heavy rain, the streets were flooded."],"Due to the heavy rain, the streets were flooded.","'Due to' must be followed by a noun phrase (the heavy rain)."),
    single("Task 17 — Choose the Sentence with the Same Meaning","CHOOSE THE SENTENCE WITH THE SAME MEANING.","\"Plastic bags blocked the drains. As a result, the street flooded.\"",["The street flooded so plastic bags blocked the drains.","The street flooded because plastic bags blocked the drains.","Plastic bags blocked the drains because the street flooded.","The street flooded although plastic bags blocked the drains."],"The street flooded because plastic bags blocked the drains.","Blocked drains are the cause and flooding is the effect, so 'because' links them correctly."),
    {type:"ordering",taskLabel:"Task 18 — Put the Ideas in Order",question:"PUT THE IDEAS IN ORDER.",task:"Put the ideas in the order in which they are discussed in the conversation.",items:["The schoolyard looks dirty","Animals swallow plastic and become ill","Blocked drains cause flooding","Single-use plastic creates a lot of waste","Reusable bottles can reduce plastic waste"].map((text,i)=>({id:"i"+(i+1),text,correctPosition:i+1})),explanation:"The students first talk about the dirty schoolyard, then harm to animals, then blocked drains and flooding, then why single-use plastic creates waste, and finally reusable bottles as a solution.",points:5},
    match("Task 19 — Match the Problem with the Solution","MATCH THE PROBLEM WITH THE SOLUTION.","Drag each solution to the problem it solves.",["Students buy new plastic bottles every day.","Students don't know where to put their rubbish.","Students aren't aware of the consequences of littering.","People don't understand how plastic harms animals."],["Bring reusable water bottles instead","Put clearly labelled recycling bins around school","Organise a clean-up campaign at school","Prepare posters explaining the effects on animals"],"Each problem has a matching solution suggested in the conversation: reusable bottles, labelled bins, a clean-up campaign, and posters."),
    single("Task 20 — Overall Listening Check","OVERALL LISTENING CHECK.","Why does Malak hope their efforts will make a difference?",["Because the teacher will give them extra marks","Because plastic will disappear within a few weeks","Because a cleaner school benefits everyone","Because the town will install new street bins"],"Because a cleaner school benefits everyone","Malak ends by saying: 'Hopefully, our efforts will make a difference because a cleaner school benefits everyone.'")

  $("back-ten").addEventListener("click",()=>{
    if(!audioPlayer.buffer)return;
    audioPlayer.seek(Math.max(0,audioPlayer.time()-10));
  });
  $("forward-ten").addEventListener("click",()=>{
    if(!audioPlayer.buffer)return;
    audioPlayer.seek(Math.min(audioPlayer.buffer.duration,audioPlayer.time()+10));
  });
  document.addEventListener("keydown",event=>{
    if(view!=="quiz"||event.altKey||event.ctrlKey||event.metaKey)return;
    const audioFocused=$("audio-controls").contains(document.activeElement)||document.activeElement===$("audio-controls");
    if(audioFocused){
      if(event.key===" "){event.preventDefault();audioPlayer.toggle()}
      if(event.key==="ArrowLeft"){event.preventDefault();$("back-ten").click()}
      if(event.key==="ArrowRight"){event.preventDefault();$("forward-ten").click()}
      return;
    }
    if(event.target.closest("button, input, textarea, select, summary"))return;
    if(event.key==="ArrowLeft"){event.preventDefault();$("previous").click()}
    if(event.key==="ArrowRight"){event.preventDefault();$("next").click()}
    const q=questions[index],buttons=$("answer-area").querySelectorAll(".choice");
    if(/^[1-6]$/.test(event.key)&&["single-choice","multi-select-exact"].includes(q.type)){
      const button=buttons[Number(event.key)-1];if(button){event.preventDefault();button.click()}
    }
    if(event.key==="Enter"&&states[index].locked){event.preventDefault();$("next").click()}
    if(event.key===" "&&["matching","ordering"].includes(q.type)){
      const check=$("answer-area").querySelector(".primary");if(check&&!check.disabled){event.preventDefault();check.click()}
    }
  });
  timer.start();renderQuestion();
  </script>
 
</body></html>
