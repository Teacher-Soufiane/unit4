<html lang="en"><head>
  <meta charset="UTF-8">

  <title>Future Perfect Simple — Quiz 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&amp;family=Poppins:wght@400;600;800&amp;display=swap" rel="stylesheet">
  <style>
html,body{margin:0;padding:0;width:100%;min-height:100vh}
body{font-family:'Poppins','Cairo',Arial,sans-serif;background:#e6edf6;color:#1e3a5f}
.quiz-container{width:100%;max-width:100%;min-height:100vh;box-sizing:border-box;padding:12px}
.quiz-card{width:100%;max-width:1100px;margin:0 auto;box-sizing:border-box;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(30,58,95,.15);overflow:hidden}
.quiz-header{background-color:#eaf4ff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px}
.header-teacher-img,.header-logo-img{height:64px;width:auto;max-width:none;object-fit:contain;flex:none}
@media(min-width:600px){.header-teacher-img,.header-logo-img{height:80px}}
@media(min-width:1024px){.header-teacher-img,.header-logo-img{height:96px}}
@media(max-width:640px){.header-teacher-img,.header-logo-img{height:45px}.quiz-header{padding:8px 12px}}
.header-title{text-align:center;line-height:1.2;flex:1}
.title-line1{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;color:#1e3a5f}
.title-line2{font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;color:#2563eb}
.title-line3{font-family:'Poppins',sans-serif;font-size:14px;font-weight:400;color:#64748b}
@media(max-width:640px){.title-line1{font-size:15px}.title-line2{font-size:11px}.title-line3{font-size:10px}}
.infobar{display:flex;justify-content:space-between;gap:8px;padding:10px 20px;background:#1e3a5f;color:#fff;font-weight:600;font-size:14px}
.infobar span:nth-child(2){text-align:center;flex:1}
@media(max-width:640px){.infobar{font-size:10px;padding:8px 10px}}
#main{padding:18px 20px 22px}
.ibox{background:#1e3a8a;color:#fff;font-weight:800;text-transform:uppercase;text-align:center;padding:16px 12px;border-radius:12px;font-size:20px}
.task{font-size:20px;font-weight:600;padding:20px 8px;text-align:center;line-height:1.5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-size:16px;color:#1e3a5f;background:#f1f5f9;border:2px solid #cbd5e1;border-radius:12px;padding:14px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tile:hover:not(:disabled){border-color:#2563eb;background:#eaf4ff}
.tile b{background:#1e3a8a;color:#fff;border-radius:50%;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.tile.ok{background:#16a34a;border-color:#15803d;color:#fff}.tile.bad{background:#dc2626;border-color:#b91c1c;color:#fff}
.tile:disabled{cursor:default;opacity:1}
@media(max-width:640px){.tile{font-size:13px;padding:10px 8px}.task,.ibox{font-size:16px}}
.fb{margin-top:16px;padding:12px 16px;border-radius:12px;border-left:6px solid}
.fb.g{background:#dcfce7;border-color:#16a34a}.fb.r{background:#fee2e2;border-color:#dc2626}.fb p{margin:6px 0 0}
.hintb,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:#1e3a8a;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hintb{margin-top:14px;background:#facc15;color:#1e3a5f}
.hint{margin-top:10px;background:#fef9c3;padding:10px 14px;border-radius:10px}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-weight:700}
.stats{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;margin-top:14px;padding:10px 14px;background:#f1f5f9;border-radius:12px;font-weight:600;font-size:14px}
@media(max-width:640px){.stats{font-size:12px}}
.center{text-align:center}
.badge{width:190px;height:190px;border-radius:50%;background:#1e3a8a;color:#fff;margin:14px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:800;box-shadow:0 6px 18px rgba(30,58,138,.35)}
.badge small{font-size:15px;font-weight:400}
.remark{font-size:34px;font-weight:800;color:#2563eb;min-height:48px}
table{width:100%;border-collapse:collapse;margin:12px 0}td{padding:7px 10px;border-bottom:1px solid #e2e8f0}
.rv{padding:10px 14px;border-radius:10px;margin:8px 0;border-left:6px solid}.rv.g{background:#dcfce7;border-color:#16a34a}.rv.r{background:#fee2e2;border-color:#dc2626}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
@media print{.quiz-header,.btns,#cf{display:none}body{background:#fff}.quiz-card{box-shadow:none}}
</style>

 <body>
  <div class="quiz-container">
   <div class="quiz-card canva-card">
    <div class="quiz-header canva-header"><img class="header-teacher-img" src="teacher.png" alt="Teacher Soufiane">
     <div class="header-title">
      <div class="title-line1">English2BAC Quizzes</div>
      <div class="title-line2">Learn • Practice • Succeed</div>
      <div class="title-line3">with Teacher.Soufiane</div>
     </div><img class="header-logo-img" src="logo.png" alt="Level-UP 2BAC">
    </div>
    <div class="infobar canva-banner"><span class="">UNIT: 4</span> <span class=""></span> <span class=""></span>
    </div>
    <div id="main"></div>
   </div>
  </div>
  <canvas id="cf"></canvas>
  <script>
const quizConfig={unit:"4",title:"FUTURE PERFECT SIMPLE",lesson:"GRAMMAR QUIZ 2",randomizeQuestions:false,randomizeChoices:true,timerEnabled:true,timerMode:"countup",countdownSeconds:600,showConfetti:true,enableSounds:true};
const LV=[
{n:"Form Detective",i:"CHOOSE THE CORRECT FUTURE PERFECT SIMPLE FORM."},
{n:"Past Participle Traps",i:"COMPLETE THE SENTENCE."},
{n:"By + Future Time",i:"COMPLETE THE SENTENCE."},
{n:"By the Time",i:"COMPLETE THE SENTENCE."},
{n:"Understanding the Future Timeline",i:"CHOOSE THE CORRECT ANSWER."},
{n:"Error Detective",i:"CHOOSE THE CORRECT SENTENCE."},
{n:"Transformation Challenge",i:"CHOOSE THE SENTENCE WITH THE SAME MEANING."},
{n:"BAC Challenge",i:"BAC CHALLENGE — CHOOSE THE CORRECT ANSWER."}];
const RAW=[
[1,"By 8 p.m., I ______ my homework.",["will have finished","will has finished","will have finish","have finished"],"The Future Perfect Simple is 'will have' + past participle: 'will have finished'.","Think about the structure: will + have + which verb form?"],
[1,"By June, Sara ______ her master's degree.",["will have obtained","will have obtain","will has obtained","will obtained"],"'Will have' is followed by the past participle: 'will have obtained'.","Think about which verb form must follow 'will have'."],
[1,"By the end of the week, we ______ the project.",["won't have completed","won't have complete","won't has completed","haven't completed"],"The negative is 'won't have' + past participle: 'won't have completed'.","Think about how the negative of 'will' is built and what follows 'have'."],
[2,"By this time next year, Morocco ______ its second surveillance satellite.",["will have launched","will have launch","will has launched","will have launcheded"],"Regular verbs take a single -ed: 'will have launched'.","Think about how a regular past participle is formed, and how many endings it takes."],
[2,"By the end of this century, machines ______ many workers in some jobs.",["will have replaced","will have replace","will has replaced","will have replaceded"],"'Replace' is regular, so the participle is 'replaced' after 'will have'.","Look at the verb after 'will have' and check its ending."],
[2,"By 2030, many cities ______ new green spaces.",["will have built","will have builded","will has built","have built"],"'Build' is irregular: build – built – built.","Think about whether 'build' is a regular or an irregular verb."],
[2,"By next summer, thousands of students ______ from university.",["will have graduated","will have graduate","will has graduated","will have graduaded"],"'Graduate' is regular and takes -d: 'graduated'.","Think about the spelling of the past participle of a verb that ends in -e."],
[3,"By the end of the school year, Sara ______ her academic goals.",["will have achieved","will have achieve","will has achieved","will achieved"],"'By the end of...' signals completion before a future point: 'will have achieved'.","Think about what 'by the end of' tells you about the action."],
[3,"By 6 p.m., the mechanic ______ the car.",["will have repaired","will have repair","will has repaired","will have repairred"],"'Repair' is regular and does not double its final letter: 'repaired'.","Think about spelling: does 'repair' double its final consonant?"],
[3,"By Friday, the secretary ______ the formal letter.",["will have written","will have wrote","will has written","will have write"],"'Write' is irregular: write – wrote – written. After 'will have' we need the past participle.","Think about the third form of the irregular verb, not the past simple."],
[4,"By the time the train arrives, the passengers ______ the station.",["will have left","will have leaved","will has left","will left"],"'Leave' is irregular: leave – left – left.","Think about whether 'leave' takes -ed."],
[4,"By the time the environmental campaign begins, the students ______ several activities.",["will have organized","will have organize","will has organized","will have organizeded"],"'By the time' + a future event means the action is completed first: 'will have organized'.","Think about the order of the two future events."],
[4,"By the time the volunteers finish their work, they ______ thousands of trees.",["will have planted","will have plant","will has planted","will planted"],"The planting is completed before the volunteers finish, so: 'will have planted'.","Think about which action will be completed first."],
[5,"“By 10 p.m., Nadia will have read the whole book.”<br>What does this sentence mean?",["Nadia will finish reading the book by 10 p.m.","Nadia will start reading the book at 10 p.m.","Nadia finished reading the book yesterday.","Nadia is reading the book now."],"The Future Perfect with 'by 10 p.m.' means the reading will be completed at or before 10 p.m.","Think about what 'by' means with a future time."],
[5,"An action completed before another future event.",["By the time the teacher arrives, the students will have solved the problem.","The students solve the problem when the teacher arrives.","The students will be solving the problem when the teacher arrives.","The students solved the problem yesterday."],"'By the time the teacher arrives' + 'will have solved' shows completion before another future event.","Look for the option with a future reference point and a completed action."],
[6,"A scientific discovery expected before next month.",["By next month, the scientists will have discovered the cause.","By next month, the scientists will have discover the cause.","By next month, the scientists will has discovered the cause.","By next month, the scientists have will discovered the cause."],"The correct structure is 'will have' + past participle: 'will have discovered'.","Check the word order and the verb form after 'will have'."],
[6,"A question about a record being broken by Friday.",["Will they have broken the record by Friday?","Will they have breaked the record by Friday?","Will have they broken the record by Friday?","Will they has broken the record by Friday?"],"In questions, 'will' comes first, then the subject, then 'have' + past participle: 'Will they have broken...?'","Think about word order in a question with 'will', and the participle of 'break'."],
[7,"The students are expected to submit their assignments before Friday.",["By Friday, the students will have submitted their assignments.","By Friday, the students will have submit their assignments.","By Friday, the students will submitted their assignments.","By Friday, the students have will submitted their assignments."],"'Before Friday' becomes 'By Friday' + 'will have' + past participle: 'will have submitted'.","Think about which expression and structure show completion before a future time."],
[8,"A new environmental programme will start in January. The organisers expect to reduce pollution significantly within two years.<br>By January 2029, the programme ______ pollution significantly.",["will have reduced","will have reduce","will has reduced","will reduced"],"'By January 2029' is the future deadline, so we need 'will have' + past participle: 'will have reduced'.","Think about the deadline and the structure it requires."],
[8,"A Moroccan university is preparing a new research programme. The programme will begin in September 2027. The researchers expect to finish their work before the end of 2030.",["By the end of 2030, the researchers will have finished their work.","By the end of 2030, the researchers will have finish their work.","By the end of 2030, the researchers will has finished their work.","By the end of 2030, the researchers have finished their work."],"'By the end of 2030' needs 'will have' + past participle: 'will have finished'.","Check the auxiliary and the verb form that follows 'will have'."]
];
const POS=["Excellent!","Great Job!","Perfect!","Keep Going!"],NEG=["Almost!","Review this rule.","Keep learning!","You'll get the next one!"];
const REM=[
{n:"Keep Practising",min:0,d:"Review the form 'will have + past participle' and the key expressions: by, by the time, before."},
{n:"Good Progress",min:11,d:"You understand the basics, but you need more practice with irregular past participles and time expressions."},
{n:"Very Good",min:15,d:"You handle most Future Perfect Simple sentences well. Review irregular participles and question word order."},
{n:"Excellent",min:18,d:"You have a very strong command of the Future Perfect Simple and its time expressions."}];
let Q=RAW.map(r=>({level:r[0],task:r[1],ch:r[2],ex:r[3],hint:r[4]}));
if(quizConfig.randomizeQuestions)Q.sort(()=>Math.random()-.5);
const N=Q.length,$=id=>document.getElementById(id),KEY="futurePerfect_q2";
const Timer={id:null,s:0,onTick:null,fmt(t){return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")},start(){this.pause();this.id=setInterval(()=>{this.s+=quizConfig.timerMode==="countdown"?-1:1;this.onTick&&this.onTick(this.s)},1000)},pause(){clearInterval(this.id);this.id=null},reset(){this.pause();this.s=quizConfig.timerMode==="countdown"?quizConfig.countdownSeconds:0},elapsed(){return quizConfig.timerMode==="countdown"?quizConfig.countdownSeconds-this.s:this.s}};
Timer.onTick=s=>{const e=$("tm");if(e)e.textContent=Timer.fmt(s);if(quizConfig.timerMode==="countdown"&&s<=0)finish()};
let cur=0,fin=false,review=false,saved={};
const mk=()=>{let o=[0,1,2,3];if(quizConfig.randomizeChoices)for(let k=3;k>0;k--){const j=Math.floor(Math.random()*(k+1));[o[k],o[j]]=[o[j],o[k]]}return{order:o,picked:null,hint:false,fb:""}};
let ST=Q.map(mk);
function qs(i){return ST[i]}
function stats(){let c=0,w=0;ST.forEach(s=>{if(s&&s.picked!==null){s.picked===0?c++:w++}});return{c,w,r:N-c-w}}
let AC;function tone(seq){if(!quizConfig.enableSounds)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
function showQuiz(){const q=Q[cur],s=qs(cur);let h=`<div class="ibox">${LV[q.level-1].i}</div><div class="task">${q.task}</div><div class="choices">`;s.order.forEach((oi,p)=>{h+=`<button class="tile" id="t${p}" onclick="pick(${p})"><b>${"ABCD"[p]}</b><span>${q.ch[oi]}</span></button>`});h+=`</div><div id="fbx"></div><div class="nav"><button class="btn" id="bp" onclick="go(-1)">◀ Previous</button><span>${cur+1} / ${N}</span><button class="btn" id="bn" onclick="go(1)"></button></div><div class="stats" id="sts"></div>`;$("main").innerHTML=h;paint()}
function paint(){const q=Q[cur],s=qs(cur),done=s.picked!==null,st=stats();s.order.forEach((oi,p)=>{const t=$("t"+p);t.disabled=done;t.className="tile"+(done?(oi===0?" ok":oi===s.picked?" bad":""):"")});$("fbx").innerHTML=done?`<div class="fb ${s.picked===0?"g":"r"}"><b>${s.fb}</b><p>${q.ex}</p></div>`:`<button class="hintb" onclick="hint()">💡 Hint</button>`+(s.hint?`<div class="hint">${q.hint}</div>`:"");$("bp").disabled=cur===0;$("bn").disabled=!done;$("bn").textContent=cur===N-1?"Finish ✔":"Next ▶";$("sts").innerHTML=`<span>✅ Correct: ${st.c}</span><span>❌ Wrong: ${st.w}</span><span>Remaining: ${st.r}</span><span>Score: ${st.c.toFixed(2)} /20</span><span>⏱ <span id="tm">${Timer.fmt(Timer.s)}</span></span>`}
function pick(p){const s=qs(cur);if(s.picked!==null)return;s.picked=s.order[p];const ok=s.picked===0,a=ok?POS:NEG;s.fb=a[Math.floor(Math.random()*a.length)];tone(ok?[[660,.12],[880,.2]]:[[300,.2],[220,.3]]);paint();if(cur===N-1)setTimeout(()=>{if(!fin)finish()},2500)}
function hint(){qs(cur).hint=true;paint()}
function go(d){if(d>0&&qs(cur).picked===null)return;if(cur+d<0)return;if(cur+d>=N){finish();return}cur+=d;showQuiz()}
function levelRows(){return LV.map((l,i)=>{let t=0,c=0;Q.forEach((q,k)=>{if(q.level===i+1){t++;if(ST[k]&&ST[k].picked===0)c++}});return{n:`Level ${i+1} — ${l.n}`,c,t}})}
function finish(){if(fin)return;fin=true;Timer.pause();const st=stats(),sc=st.c,time=Timer.elapsed();const R=[...REM].reverse().find(r=>sc>=r.min),acc=Math.round(sc/N*100);let h=`<div class="center"><h2>QUIZ · Unit ${quizConfig.unit} · ${quizConfig.title} · ${quizConfig.lesson}</h2><div class="badge">${sc.toFixed(2)}<small>/20</small></div><div class="remark" id="rm">…</div><p id="rd"></p></div><table><tr><td>Final Score</td><td>${sc.toFixed(2)} /20</td></tr><tr><td>Correct Answers</td><td>${st.c}</td></tr><tr><td>Wrong Answers</td><td>${N-st.c}</td></tr><tr><td>Accuracy</td><td>${acc}%</td></tr><tr><td>Time Taken</td><td>${Timer.fmt(time)}</td></tr></table><div class="btns"><button class="btn" onclick="restart()">Restart Quiz</button><button class="btn" onclick="window.print()">Print Results</button></div>`;$("main").innerHTML=h;tone([[523,.15],[659,.15],[784,.15],[1047,.4]]);$("rm").textContent=R.n;$("rd").textContent=R.d;if(quizConfig.showConfetti&&sc>=18)confetti()}
function restart(){ST=Q.map(mk);cur=0;fin=false;Timer.reset();Timer.start();showQuiz()}
function confetti(){const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,s:5+Math.random()*6,c:`hsl(${Math.random()*360},85%,55%)`}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<260)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
document.addEventListener("keydown",e=>{if(fin)return;if("1234".includes(e.key)&&e.key.length===1){pick(+e.key-1);return}if(e.target.tagName==="BUTTON"&&(e.key==="Enter"||e.key===" "))return;if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){e.preventDefault();go(1)}else if(e.key==="ArrowLeft")go(-1)});
Timer.reset();showQuiz();if(quizConfig.timerEnabled)Timer.start();
</script>
