.rv{padding:10px 14px;border-radius:10px;margin:8px 0;border-left:6px solid}.rv.g{background:#dcfce7;border-color:#16a34a}.rv.r{background:#fee2e2;border-color:#dc2626}

 <script>(function(){var ok=true;try{window.localStorage.getItem("__t")}catch(e){ok=false}
if(!ok){var m={};try{Object.defineProperty(window,"localStorage",{configurable:true,value:{
getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null},
setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}}}})}catch(e2){}}})();</script></head>
 <body>
  <div class="quiz-container">
   <div class="quiz-card canva-card">
    <div class="quiz-header canva-header"><img class="header-teacher-img" src="teacher.png" alt="Teacher Soufiane">
     <div class="header-title">
      <div class="title-line1">English2BAC Quizzes</div>
      <div class="title-line2">Learn • Practice • Succeed</div>
      <div class="title-line3">with Teacher.Soufiane</div>

  <canvas id="cf"></canvas>
  <script>
/* ===== CONFIG ===== */
const quizConfig={unit:"4",title:"FUTURE SIMPLE vs FUTURE PERFECT SIMPLE",lesson:"GRAMMAR QUIZ 4",randomizeQuestions:false,randomizeChoices:true,timerEnabled:true,timerMode:"countup",countdownSeconds:600,showConfetti:true,enableSounds:true};
/* ===== LEVELS (progression order) ===== */
const LV=[
{n:"Future Form Warm-Up",i:"CHOOSE THE CORRECT FORM."},
{n:"Time-Expression Detector",i:"CHOOSE THE CORRECT ANSWER."},
{n:"Future Timeline Challenge",i:"READ THE SITUATION AND CHOOSE THE CORRECT FORM."},
{n:"In + Period of Time",i:"CHOOSE THE CORRECT FORM."},
{n:"Future Detective",i:"READ THE CONTEXT AND CHOOSE THE CORRECT FORM."},
{n:"Error & Trap Hunt",i:"CHOOSE THE CORRECT ANSWER."},
{n:"Transformation Challenge",i:"CHOOSE THE SENTENCE WITH THE SAME MEANING."},
{n:"BAC Final Challenge",i:"BAC FINAL CHALLENGE — CHOOSE THE CORRECT ANSWER."}];
/* Each item: [level, task, [CORRECT first, wrong, wrong, wrong], explanation, hint] */
const RAW=[
[1,"I think people ______ more electric cars in the future.",["will use","will have used","will has used","will using"],"An opinion about the future ('I think... in the future') uses the Future Simple: 'will use'.","Think about whether this is a prediction or an action completed by a deadline."],
[1,"By the end of this year, our school ______ a new computer lab.",["will have opened","will open","will has opened","will have open"],"'By the end of this year' is a deadline, so the action will be completed by then: 'will have opened'.","Think about what 'by the end of' tells you."],
[1,"My brother ______ university next September.",["will start","will have started","will has started","will have start"],"'Next September' is a single future event with no deadline, so we use the Future Simple: 'will start'.","Think about whether there is a deadline or just a future event."],
[2,"By 2030, many countries ______ their use of renewable energy.",["will have increased","will increase","will has increased","will have increase"],"'By 2030' is a future point by which the increase will be completed: 'will have increased'.","Look at the time expression and what 'by' means."],
[2,"I think technology ______ education in the future.",["will transform","will have transformed","will has transformed","will have transform"],"This is a general prediction with no deadline, so the Future Simple is used: 'will transform'.","Think about whether there is a completion deadline in the sentence."],
[2,"In ten years, scientists ______ new solutions to many environmental problems.",["will have developed","will develop","will has developed","will have develop"],"'In + a period of time' is a Future Perfect indicator: by then, the solutions will already be developed: 'will have developed'.","Think about what 'in + a period of time' signals."],
[3,"The students will begin the project in September. They expect to finish it before December.<br>By December, the students ______ the project.",["will have completed","will complete","will has completed","will have complete"],"'By December' is the deadline, and the project will be finished before it: 'will have completed'.","Think about the deadline and what will already be done by then."],
[3,"The university will open a new library next year.<br>The new library ______ next year.",["will open","will have opened","will opening","will has opened"],"The opening is a single future event with no deadline: Future Simple 'will open'.","Think about whether the sentence mentions a completion deadline."],
[3,"The workers will start building the bridge in January. The bridge is expected to be ready by June.<br>By June, the workers ______ the bridge.",["will have built","will have builded","will build","will has built"],"'By June' is the deadline and 'build' is irregular: build – built – built, so 'will have built'.","Think about the deadline and the irregular past participle of 'build'."],
[4,"In two years, the company ______ over a thousand new jobs.",["will have created","will create","will has created","will have create"],"'In + a period of time' is a Future Perfect indicator: by then, the jobs will already be created: 'will have created'.","Think about what 'in + a period of time' signals."],
[4,"Sara is currently in her final year at university. In three years, she ______ her university studies.",["will have completed","will complete","will has completed","will have complete"],"'In three years' is a Future Perfect indicator: by then, her studies will already be completed: 'will have completed'.","Think about what 'in + a period of time' signals."],
[4,"In ten years, many families ______ their petrol cars with electric ones.",["will have replaced","will replace","will has replaced","will have replace"],"'In + a period of time' is a Future Perfect indicator: by then, the replacement will already be completed: 'will have replaced'.","Think about what 'in + a period of time' signals."],
[4,"The environmental programme starts this year and will continue for ten years. In ten years, it ______ thousands of trees.",["will have planted","will plant","will has planted","will have plant"],"After ten years of the programme, the planting will already be completed: 'will have planted'.","Think about what the programme will already have done after ten years."],
[5,"The school has planned a large environmental campaign for next month. The campaign will begin next month.<br>The students ______ the campaign next month.",["will launch","will have launched","will has launched","will have launch"],"'Next month' is a single future event with no deadline: Future Simple 'will launch'.","Think about whether a deadline is mentioned or only a future event."],
[5,"The environmental campaign will begin next month and will include several activities. The students expect to complete all the activities before the end of the school year.<br>By the end of the school year, the students ______ all the activities.",["will have organized","will organize","will has organized","will have organize"],"'By the end of the school year' is the deadline, so the activities will be completed by then: 'will have organized'.","Think about the deadline and what will already be done."],
[6,"A prediction about clean energy sources by 2035.",["By 2035, scientists will have discovered new sources of clean energy.","By 2035, scientists will have discover new sources of clean energy.","By 2035, scientists will has discovered new sources of clean energy.","By 2035, scientists will discovered new sources of clean energy."],"After 'will have' we need the past participle: 'will have discovered'.","Check the verb form after 'will have'."],
[6,"By the time the guests arrive, we ______ the food.",["will have prepared","will have prepare","will has prepared","will prepared"],"'By the time' + a future event means the action is completed first: 'will have prepared'.","Think about which action will be finished first."],
[7,"The workers will finish the construction before the end of the year.",["By the end of the year, the workers will have finished the construction.","By the end of the year, the workers will have finish the construction.","By the end of the year, the workers will has finished the construction.","By the end of the year, the workers will finished the construction."],"'Before the end of the year' becomes 'By the end of the year' + 'will have' + past participle.","Think about the structure that expresses completion by a future deadline."],
[8,"Morocco is investing in renewable energy. Several new solar projects are planned for the coming years.",["Morocco will build several solar projects next year.","Morocco will have build several solar projects next year.","Morocco will has built several solar projects next year.","Morocco will have built several solar projects next year."],"'Next year' marks a future event with no completion deadline: Future Simple 'will build'.","Think about whether the sentence gives a deadline or just a time of the event."],
[8,"A city is planning a major sustainable-development project. Construction will begin in 2027 and is expected to finish before 2030.",["By 2030, the city will have completed the project.","By 2030, the city will complete the project.","By 2030, the city will has completed the project.","By 2030, the city will have complete the project."],"'By 2030' is the deadline and the project will be finished before it: 'will have completed'.","Think about the deadline and the verb form after 'will have'."]
];
const POS=["Excellent!","Great Job!","Perfect!","Keep Going!"],NEG=["Almost!","Review this rule.","Keep learning!","You'll get the next one!"];
const REM=[
{n:"Keep Practising",min:0,d:"Review the key distinction: Future Simple for an event that will happen, Future Perfect Simple for an action already completed by a future point."},
{n:"Good Progress",min:11,d:"You understand the basics, but you need more practice with time expressions like 'by' and 'in + period'."},
{n:"Very Good",min:15,d:"You handle most future contexts well. Review 'in + period' and 'by the time' contrasts."},
{n:"Excellent",min:18,d:"You have a very strong command of Future Simple versus Future Perfect Simple and when to use each one."}];
/* ===== QUESTION OBJECTS ===== */
let Q=RAW.map(r=>({level:r[0],task:r[1],ch:r[2],ex:r[3],hint:r[4]}));
if(quizConfig.randomizeQuestions)Q.sort(()=>Math.random()-.5);
const N=Q.length,$=id=>document.getElementById(id),KEY="mixedFuture_q4";
/* ===== TIMER MODULE (independent of rendering) ===== */
const Timer={id:null,s:0,onTick:null,
fmt(t){return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")},
start(){this.pause();this.id=setInterval(()=>{this.s+=quizConfig.timerMode==="countdown"?-1:1;this.onTick&&this.onTick(this.s)},1000)},
pause(){clearInterval(this.id);this.id=null},
reset(){this.pause();this.s=quizConfig.timerMode==="countdown"?quizConfig.countdownSeconds:0},
elapsed(){return quizConfig.timerMode==="countdown"?quizConfig.countdownSeconds-this.s:this.s}};
Timer.onTick=s=>{const e=$("tm");if(e)e.textContent=Timer.fmt(s);if(quizConfig.timerMode==="countdown"&&s<=0)finish()};
/* ===== STATE ===== */
let cur=0,fin=false,review=false,saved={};
const mk=()=>{let o=[0,1,2,3];if(quizConfig.randomizeChoices)for(let k=3;k>0;k--){const j=Math.floor(Math.random()*(k+1));[o[k],o[j]]=[o[j],o[k]]}return{order:o,picked:null,hint:false,fb:""}};
/* Choice order is fixed ONCE here for every question, then only read */
let ST=Q.map(mk);
/* Shuffle ONCE per question; order is stored and never recomputed on re-render */
function qs(i){return ST[i]}
function stats(){let c=0,w=0;ST.forEach(s=>{if(s&&s.picked!==null){s.picked===0?c++:w++}});return{c,w,r:N-c-w}}
/* ===== SOUNDS (WebAudio only) ===== */
let AC;function tone(seq){if(!quizConfig.enableSounds)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
/* ===== QUESTION SCREEN (single reusable renderer for all levels) ===== */
function showQuiz(){
const q=Q[cur],s=qs(cur);
let h=`<div class="ibox">${LV[q.level-1].i}</div><div class="task">${q.task}</div><div class="choices">`;
s.order.forEach((oi,p)=>{h+=`<button class="tile" id="t${p}" onclick="pick(${p})"><b>${"ABCD"[p]}</b><span>${q.ch[oi]}</span></button>`});
h+=`</div><div id="fbx"></div><div class="nav"><button class="btn" id="bp" onclick="go(-1)">◀ Previous</button><span>${cur+1} / ${N}</span><button class="btn" id="bn" onclick="go(1)"></button></div><div class="stats" id="sts"></div>`;
$("main").innerHTML=h;paint()}
/* paint(): updates states IN PLACE; tile elements and positions are never rebuilt or reordered */
function paint(){const q=Q[cur],s=qs(cur),done=s.picked!==null,st=stats();
s.order.forEach((oi,p)=>{const t=$("t"+p);t.disabled=done;t.className="tile"+(done?(oi===0?" ok":oi===s.picked?" bad":""):"")});
$("fbx").innerHTML=done?`<div class="fb ${s.picked===0?"g":"r"}"><b>${s.fb}</b><p>${q.ex}</p></div>`:`<button class="hintb" onclick="hint()">💡 Hint</button>`+(s.hint?`<div class="hint">${q.hint}</div>`:"");
$("bp").disabled=cur===0;$("bn").disabled=!done;$("bn").textContent=cur===N-1?"Finish ✔":"Next ▶";
$("sts").innerHTML=`<span>✅ Correct: ${st.c}</span><span>❌ Wrong: ${st.w}</span><span>Remaining: ${st.r}</span><span>Score: ${st.c.toFixed(2)} /20</span><span>⏱ <span id="tm">${Timer.fmt(Timer.s)}</span></span>`}
function pick(p){const s=qs(cur);if(s.picked!==null)return;s.picked=s.order[p];
const ok=s.picked===0,a=ok?POS:NEG;s.fb=a[Math.floor(Math.random()*a.length)];
tone(ok?[[660,.12],[880,.2]]:[[300,.2],[220,.3]]);paint();
if(cur===N-1)setTimeout(()=>{if(!fin)finish()},2500)}
function hint(){qs(cur).hint=true;paint()}
function go(d){if(d>0&&qs(cur).picked===null)return;if(cur+d<0)return;if(cur+d>=N){finish();return}cur+=d;showQuiz()}
/* ===== RESULT PAGE ===== */
function levelRows(){return LV.map((l,i)=>{let t=0,c=0;Q.forEach((q,k)=>{if(q.level===i+1){t++;if(ST[k]&&ST[k].picked===0)c++}});return{n:`Level ${i+1} — ${l.n}`,c,t}})}
function finish(){if(fin)return;fin=true;Timer.pause();const st=stats(),sc=st.c,time=Timer.elapsed();
try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){saved={}}
saved={best:Math.max(saved.best||0,sc),attempts:(saved.attempts||0)+1,last:sc,time:time};
try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}
const R=[...REM].reverse().find(r=>sc>=r.min),acc=Math.round(sc/N*100);
let h=`<div class="center"><h2>QUIZ · Unit ${quizConfig.unit} · ${quizConfig.title} · ${quizConfig.lesson}</h2>
<div class="badge">${sc.toFixed(2)}<small>/20</small></div><div class="remark" id="rm">…</div><p id="rd"></p></div>
<table><tr><td>Final Score</td><td>${sc.toFixed(2)} /20</td></tr><tr><td>Correct Answers</td><td>${st.c}</td></tr><tr><td>Wrong Answers</td><td>${N-st.c}</td></tr><tr><td>Accuracy</td><td>${acc}%</td></tr><tr><td>Time Taken</td><td>${Timer.fmt(time)}</td></tr><tr><td>Number of Attempts</td><td>${saved.attempts}</td></tr><tr><td>Best Score</td><td>${saved.best.toFixed(2)} /20</td></tr>`;
levelRows().forEach(r=>h+=`<tr><td>${r.n}</td><td>${r.c}/${r.t}</td></tr>`);
h+=`</table><div class="btns"><button class="btn" onclick="toggleReview()">Review My Answers</button><button class="btn" onclick="restart()">Restart Quiz</button><button class="btn" onclick="window.print()">Print Results</button><button class="btn" onclick="saveRes()">Save Results</button></div><div id="rv"></div>`;
$("main").innerHTML=h;tone([[523,.15],[659,.15],[784,.15],[1047,.4]]);
/* Slot-machine remark: cycles, slows down, lands on the right one */
let i=0,d=60,t=0;(function step(){if(t<3000){$("rm").textContent=REM[i++%4].n;t+=d;d*=1.12;setTimeout(step,d)}else{$("rm").textContent=R.n;$("rd").textContent=R.d}})();
if(quizConfig.showConfetti&&sc>=18)confetti()}
function toggleReview(){review=!review;let h="";if(review)LV.forEach((l,li)=>{h+=`<h3>Level ${li+1} — ${l.n}</h3>`;Q.forEach((q,k)=>{if(q.level!==li+1)return;const s=ST[k],ok=s.picked===0;h+=`<div class="rv ${ok?"g":"r"}"><b>Q${k+1}.</b> ${q.task}<br>Your answer: ${q.ch[s.picked]}<br>Correct answer: ${q.ch[0]}<br><i>${q.ex}</i></div>`})});$("rv").innerHTML=h}
function saveRes(){const st=stats();let t=`${quizConfig.title} — ${quizConfig.lesson} (Unit ${quizConfig.unit})\nScore: ${st.c.toFixed(2)} /20\nTime: ${Timer.fmt(Timer.elapsed())}\n\n`;levelRows().forEach(r=>t+=`${r.n}: ${r.c}/${r.t}\n`);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="quiz-results.txt";a.click()}
function restart(){ST=Q.map(mk);cur=0;fin=false;review=false;Timer.reset();Timer.start();showQuiz()}
/* ===== CONFETTI ===== */
function confetti(){const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,s:5+Math.random()*6,c:`hsl(${Math.random()*360},85%,55%)`}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<260)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
/* ===== KEYBOARD: 1-4 select, arrows / Enter / Space navigate ===== */
document.addEventListener("keydown",e=>{if(fin)return;
if("1234".includes(e.key)&&e.key.length===1){pick(+e.key-1);return}
if(e.target.tagName==="BUTTON"&&(e.key==="Enter"||e.key===" "))return;
if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){e.preventDefault();go(1)}
else if(e.key==="ArrowLeft")go(-1)});
/* ===== START ===== */
Timer.reset();showQuiz();if(quizConfig.timerEnabled)Timer.start();
</script>
